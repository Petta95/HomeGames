<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomi Cose Città Speed — Party Games Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">

<style>
  .letter-card{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* ---- Schermata più compatta: entra tutta in un'unica vista ---- */
  #gameView.stage{
    padding: 18px 20px 30px;
    gap: 14px;
    justify-content: flex-start;
  }
  #gameView .score-grid{ gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  #gameView .score-card{ padding: 10px; gap: 4px; }
  #gameView .team-name{ font-size: 0.9rem; padding: 3px; }
  #gameView .score-value{ font-size: 1.6rem; }
  #gameView .score-btn{ padding: 7px 14px; font-size: 0.8rem; }
  #gameView .letter-card{ gap: 10px; }
  #gameView .question-eyebrow{ margin-bottom: 0; font-size: 0.82rem; }
  #gameView .big-letter-display{ font-size: clamp(3rem, 9vw, 5.5rem); }
  #gameView .question-card{ padding: 20px 26px; }
  #gameView .question-text{ font-size: clamp(1.05rem, 2.6vw, 1.6rem); }
  #gameView .round-badge{ padding: 6px 16px; font-size: 0.85rem; }
  #gameView .actions-row{ gap: 12px; }
  #gameView .btn{ padding: 13px 24px; font-size: 0.95rem; }
</style>
</head>
<body class="theme-yellow">

<div class="bg-blobs"><span></span><span></span></div>

<nav class="navbar">
  <a class="nav-back" href="menu.html">← Menu</a>
  <span class="nav-title"><span class="dot"></span>🔤 Nomi Cose Città Speed</span>
  <span class="nav-counter" id="counter">Lettera: —</span>
</nav>

<main class="stage" id="gameView">

  <!-- Tabellone punteggi -->
  <div class="score-grid" id="scoreGrid"></div>

  <!-- Estrazione lettera -->
  <div class="letter-card">
    <div class="question-eyebrow">Lettera in gioco</div>
    <div class="big-letter-display" id="letterDisplay">?</div>
    <button class="btn btn-primary" id="drawLetterBtn">🎲 ESTRAI LETTERA</button>
  </div>

  <!-- Argomento corrente -->
  <div class="question-card">
    <div class="question-eyebrow">Argomento</div>
    <p class="question-text" id="topicText">Estrai una lettera per iniziare!</p>
  </div>
  <span class="round-badge" id="roundBadge">Argomento —/5</span>

  <div class="actions-row">
    <button class="btn btn-outline" id="nextTopicBtn" disabled>PROSSIMO ARGOMENTO ▶</button>
    <button class="btn btn-outline" id="restartBtn">🔄 Nuova Partita</button>
  </div>
</main>

<!-- Overlay vincitore -->
<div class="timer-overlay" id="winnerOverlay">
  <div class="timer-number" id="winnerText" style="font-size: clamp(2rem,7vw,4.5rem);">🏆</div>
  <div class="timer-label" id="winnerLabel">Vincitore!</div>
  <button class="btn btn-primary" id="winnerRestartBtn" style="margin-top: 20px;">🔄 Nuova Partita</button>
</div>

<script>
  /* =========================================================

     per espandere il gioco, non serve toccare altro codice.
     ========================================================= */
  const TOPICS = [
    "Cose che si trovano su una scrivania",
    "Mammiferi",
    "Città italiane",
    "Marche di vestiti",
    "Canzoni",
    "Insetti",
    "Primi piatti",
    "Capitali",
    "Cose che si trovano in mare",
    "Animali",
    "Cose che si trovano in un bar",
    "Nomi femminili",
    "Mestieri",
    "Squadre di calcio",
    "Nazioni",
    "Medicinali",
    "Nomi maschili",
    "Cose che si trovano a scuola",
    "Cose che si possono comprare online",
    "Film drammatici o romantici",
    "Drink da aperitivo",
    "Marche di auto",
    "Nomi di uccelli",
    "Piatti costosi",
    "Cantanti",
    "Dolci",
    "Marche italiane",
    "Cose che si trovano in palestra o alla spa",
    "Giochi all'aperto",
    "Fiori",
    "Cose appiccicose",
    "Cose che si trovano in cucina",
    "Cibi da colazione",
    "Cose rotonde",
    "Tipi di pizza",
    "Gruppi musicali",
    "Pesci",
    "Cose luminose",
    "Cose che si trovano in spiaggia",
    "Colori",
    "Coppie famose",
    "Cose verdi",
    "Pokémon",
    "Supereroi",
    "Malattie",
    "Cose estinte",
    "Allergie",
    "Razze di cane",
    "Cose tipiche italiane",
    "Mezzi di trasporto",
    "Mostri o cattivi dei film",
    "Titoli di film",
    "Generi musicali",
    "Secondi piatti",
    "Attori",
    "Sport",
    "Elementi chimici",
    "Lingue",
    "Frutti",
    "Città americane",
    "Rettili",
    "Termini culinari",
    "Cose che si trovano in ospedale",
    "Materie scolastiche",
    "Parole inglesi",
    "Cose puzzolenti",
    "Personaggi Disney o Pixar",
    "Parti del corpo",
    "Cose che si rompono",
    "Componenti di un'auto",
    "Piante",
    "Minerali",
    "Strumenti musicali",
    "Monumenti",
    "Vie di Modena",
    "Opere d'arte",
    "Calciatori",
    "Cocktail",
    "Formaggi",
    "Gusti di gelato",
    "Cose rumorose",
    "Cose che non dovrebbero esistere",
    "Cose romantiche",
    "Cose rosse",
    "Cose che si perdono facilmente",
    "Marche di telefoni",
    "Personaggi Marvel",
    "Cose che metti in valigia",
    "Discipline olimpiche",
    "Cose fredde",
    "Cose calde",
    "Marche di profumi",
    "Social network",
    "Videogiochi famosi",
    "Cose che si trovano in un ufficio",
    "Bevande analcoliche",
    "Cose a righe",
    "Cose che fanno rumore quando si rompono",
    "Personaggi delle fiabe",
    "Cose che si trovano in un aeroporto",
    "Vini italiani",
    "Cose che si trovano in una valigetta da lavoro",
    "Cose fredde da mangiare",
    "Marche di pneumatici",
    "Cose che si trovano in un negozio di ferramenta",
    "Fiumi italiani",
    "Isole italiane",
    "Cose che associ alla montagna",
    "Cose che associ al mare",
    "Personaggi storici famosi",
    "Cose che si trovano in una libreria",
    "Cose appuntite",
    "Cose che si trovano in un cantiere",
    "Cose morbide",
    "Marche di detersivi",
    "Cose che si trovano in un parco giochi",
    "Cose che associ a Halloween",
    "Cose trasparenti",
    "Cose che si trovano in una valigia da viaggio",
    "Cocktail analcolici",
    "Cose pesanti",
    "Cose che si trovano in un salone di bellezza",
    "Marche di moto",
    "Cose che associ alla scuola elementare",
    "Cose che fanno bene alla salute",
    "Marche di occhiali",
    "Cose che si trovano in un ristorante giapponese",
    "Cose quadrate",
    "Attori italiani",
    "Cose che associ a un compleanno"
  ];

  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const WIN_SCORE = 25;
  const MAX_ROUNDS_PER_LETTER = 5;

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* ---- Squadre globali (nomi/colori/punteggio impostati in index.html) ----
     Se presenti, il gioco riparte da lì senza richiedere nomi ogni volta e
     tiene il punteggio totale sempre sincronizzato con le altre schede. */
  const GLOBAL_TEAMS_KEY = "homeGamesTeams";
  function loadGlobalTeams(){
    try {
      const raw = localStorage.getItem(GLOBAL_TEAMS_KEY);
      if (raw){
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.teams) && data.teams.length >= 2) return data;
      }
    } catch(e) { /* dati corrotti: si ignora */ }
    return null;
  }
  function saveGlobalTeam(index, name, score){
    const data = loadGlobalTeams();
    if (!data || !data.teams[index]) return;
    data.teams[index].name = name;
    data.teams[index].score = score;
    localStorage.setItem(GLOBAL_TEAMS_KEY, JSON.stringify(data));
  }

  /* scoreBaseline[i] = punteggio globale già accumulato quando è iniziata
     questa partita: il punteggio locale (0..WIN_SCORE) si aggiunge sopra,
     così "Nuova Partita" azzera la sfida ma non il totale di serata. */
  let scoreBaseline = [0, 0];
  let teamColors = [null, null];

  function buildTeams(){
    const global = loadGlobalTeams();
    if (global){
      scoreBaseline = [global.teams[0].score, global.teams[1].score];
      teamColors = [global.teams[0].color, global.teams[1].color];
      return [
        { name: global.teams[0].name, score: 0 },
        { name: global.teams[1].name, score: 0 }
      ];
    }
    scoreBaseline = [0, 0];
    teamColors = [null, null];
    return [
      { name: "Squadra A", score: 0 },
      { name: "Squadra B", score: 0 }
    ];
  }

  let teams = buildTeams();
  let topicOrder = shuffle([...TOPICS]);
  let topicIndex = 0;
  let currentLetter = null;
  let roundCount = 0;

  /* ---- Elementi DOM ---- */
  const scoreGrid = document.getElementById("scoreGrid");
  const letterDisplay = document.getElementById("letterDisplay");
  const drawLetterBtn = document.getElementById("drawLetterBtn");
  const topicText = document.getElementById("topicText");
  const roundBadge = document.getElementById("roundBadge");
  const nextTopicBtn = document.getElementById("nextTopicBtn");
  const restartBtn = document.getElementById("restartBtn");
  const counter = document.getElementById("counter");
  const winnerOverlay = document.getElementById("winnerOverlay");
  const winnerLabel = document.getElementById("winnerLabel");
  const winnerRestartBtn = document.getElementById("winnerRestartBtn");

  /* ---- Tabellone punteggi ---- */
  function renderScoreboard(){
    scoreGrid.innerHTML = "";
    teams.forEach((team, i) => {
      const card = document.createElement("div");
      card.className = "score-card";
      if (teamColors[i]) card.style.borderLeft = `4px solid ${teamColors[i]}`;
      card.innerHTML = `
        <input class="team-name" type="text" value="${team.name}" data-index="${i}" maxlength="24">
        <div class="score-value" id="score-${i}">${scoreBaseline[i] + team.score}</div>
        <button class="score-btn" data-index="${i}">+1 Punto</button>
      `;
      scoreGrid.appendChild(card);
    });
  }

  scoreGrid.addEventListener("click", (e) => {
    if (!e.target.classList.contains("score-btn")) return;
    const i = Number(e.target.dataset.index);
    teams[i].score++;
    document.getElementById(`score-${i}`).textContent = scoreBaseline[i] + teams[i].score;
    saveGlobalTeam(i, teams[i].name, scoreBaseline[i] + teams[i].score);
    if (window.renderGlobalScoreWidget) window.renderGlobalScoreWidget();
    checkWinner();
  });

  scoreGrid.addEventListener("change", (e) => {
    if (!e.target.classList.contains("team-name")) return;
    const i = Number(e.target.dataset.index);
    teams[i].name = e.target.value.trim() || `Squadra ${i === 0 ? "A" : "B"}`;
    saveGlobalTeam(i, teams[i].name, scoreBaseline[i] + teams[i].score);
  });

  function checkWinner(){
    const winner = teams.find(t => t.score >= WIN_SCORE);
    if (winner){
      winnerLabel.textContent = `🏆 ${winner.name} VINCE LA PARTITA!`;
      winnerOverlay.classList.add("active");
    }
  }

  /* ---- Estrazione lettera ---- */
  function nextTopic(){
    topicIndex++;
    if (topicIndex >= topicOrder.length){
      topicOrder = shuffle([...TOPICS]);
      topicIndex = 0;
    }
    topicText.textContent = topicOrder[topicIndex];
  }

  drawLetterBtn.addEventListener("click", () => {
    let letter;
    do {
      letter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
    } while (letter === currentLetter && LETTERS.length > 1);

    currentLetter = letter;
    letterDisplay.textContent = letter;
    counter.textContent = `Lettera: ${letter}`;
    roundCount = 1;
    nextTopic();
    roundBadge.textContent = `Argomento ${roundCount}/${MAX_ROUNDS_PER_LETTER}`;
    roundBadge.classList.remove("warn");
    nextTopicBtn.disabled = false;
  });

  /* ---- Prossimo argomento (stessa lettera) ---- */
  nextTopicBtn.addEventListener("click", () => {
    if (roundCount >= MAX_ROUNDS_PER_LETTER) return;
    roundCount++;
    nextTopic();
    roundBadge.textContent = `Argomento ${roundCount}/${MAX_ROUNDS_PER_LETTER}`;

    if (roundCount >= MAX_ROUNDS_PER_LETTER){
      roundBadge.textContent = `Argomento ${roundCount}/${MAX_ROUNDS_PER_LETTER} — Cambia lettera! 🔄`;
      roundBadge.classList.add("warn");
      nextTopicBtn.disabled = true;
    }
  });

  /* ---- Nuova partita ---- */
  function resetGame(){
    teams = buildTeams();
    topicOrder = shuffle([...TOPICS]);
    topicIndex = 0;
    currentLetter = null;
    roundCount = 0;

    renderScoreboard();
    letterDisplay.textContent = "?";
    counter.textContent = "Lettera: —";
    topicText.textContent = "Estrai una lettera per iniziare!";
    roundBadge.textContent = "Argomento —/5";
    roundBadge.classList.remove("warn");
    nextTopicBtn.disabled = true;
    winnerOverlay.classList.remove("active");
  }

  restartBtn.addEventListener("click", resetGame);
  winnerRestartBtn.addEventListener("click", resetGame);

  /* ---- Se il punteggio viene cambiato dal widget flottante, si aggiorna qui ---- */
  window.addEventListener("globalScoreChanged", () => {
    const global = loadGlobalTeams();
    if (!global) return;
    scoreBaseline = [global.teams[0].score, global.teams[1].score];
    renderScoreboard();
  });

  renderScoreboard();
</script>


<!-- ============================================================
     WIDGET PUNTEGGIO GLOBALE — visibile in ogni gioco, legge/scrive
     la stessa chiave localStorage impostata in index.html. Non
     dipende dalle variabili interne del gioco che lo ospita.
     ============================================================ -->
<div id="globalScoreWidget" class="global-score-widget"></div>
<style>
  .global-score-widget{
    position: fixed; bottom: 14px; right: 14px; z-index: 99999;
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    font-family: 'Inter', sans-serif; pointer-events: none;
  }
  .global-score-widget > *{ pointer-events: auto; }
  .gsw-team{
    display: flex; align-items: center; gap: 6px;
    background: rgba(8,10,20,0.88); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; padding: 5px 8px 5px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px -4px rgba(0,0,0,0.5);
    font-size: 0.76rem; color: #fff; white-space: nowrap;
  }
  .gsw-dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .gsw-name{ font-weight: 700; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .gsw-score{ font-weight: 900; font-family: 'Poppins', sans-serif; min-width: 18px; text-align: center; }
  .gsw-btn{
    width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; font-size: 0.72rem;
    display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0;
    transition: background 0.15s ease;
  }
  .gsw-btn:hover{ background: rgba(255,255,255,0.32); }
  .gsw-reset{
    font-size: 0.65rem; color: rgba(255,255,255,0.55);
    background: rgba(8,10,20,0.7); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; cursor: pointer; padding: 3px 10px;
  }
  .gsw-reset:hover{ color: #fff; border-color: rgba(255,255,255,0.3); }
  @media (max-width: 560px){
    .global-score-widget{ bottom: 8px; right: 8px; }
    .gsw-name{ max-width: 72px; }
  }
</style>
<script>
(function(){
  var KEY = "homeGamesTeams";
  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw){
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.teams) && d.teams.length >= 2) return d;
      }
    } catch(e) {}
    return null;
  }
  function save(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  function esc(s){
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }
  window.renderGlobalScoreWidget = function(){
    var el = document.getElementById("globalScoreWidget");
    if (!el) return;
    var data = load();
    if (!data){ el.innerHTML = ""; return; }
    var n = data.count || data.teams.length;
    var html = data.teams.slice(0, n).map(function(t, i){
      return '<div class="gsw-team">' +
        '<span class="gsw-dot" style="background:' + esc(t.color || "#4dd9ff") + '"></span>' +
        '<span class="gsw-name">' + esc(t.name) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="-1" aria-label="Togli un punto">−</button>' +
        '<span class="gsw-score">' + (t.score || 0) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="1" aria-label="Aggiungi un punto">+</button>' +
      '</div>';
    }).join("");
    html += '<button type="button" class="gsw-reset" id="gswResetBtn">azzera punteggi</button>';
    el.innerHTML = html;
  };
  document.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest(".gsw-btn") : null;
    if (btn){
      var data = load();
      if (!data) return;
      var i = Number(btn.getAttribute("data-gsw-i"));
      var d = Number(btn.getAttribute("data-gsw-d"));
      if (!data.teams[i]) return;
      data.teams[i].score = Math.max(0, (data.teams[i].score || 0) + d);
      save(data);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
      return;
    }
    if (e.target && e.target.id === "gswResetBtn"){
      var data2 = load();
      if (!data2) return;
      if (!confirm("Azzerare il punteggio di tutte le squadre?")) return;
      data2.teams.forEach(function(t){ t.score = 0; });
      save(data2);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
    }
  });
  window.renderGlobalScoreWidget();
})();
</script>
