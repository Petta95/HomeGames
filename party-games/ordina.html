<style>
  /* Schermata di gioco più compatta: griglia ampia ma bassa,
     per vedere tutte le squadre senza scorrere troppo. */
  #gameView.stage{
    max-width: 1280px;
    padding: 18px 20px 36px;
    gap: 14px;
    justify-content: flex-start;
  }
  #gameView .question-card{ padding: 18px 26px; }
  #gameView .question-eyebrow{ margin-bottom: 6px; }
  #gameView .question-text{ font-size: clamp(1.1rem, 2.2vw, 1.6rem); }
  #gameView .btn{ padding: 11px 22px; font-size: 0.95rem; }

  /* Tabellone punteggi compatto (sola visualizzazione + nome editabile) */
  .score-grid.readonly{ gap: 10px; }
  .score-grid.readonly .score-card{ padding: 10px; gap: 4px; }
  .score-grid.readonly .team-name{ font-size: 0.9rem; padding: 3px; }
  .score-grid.readonly .score-value{ font-size: 1.6rem; }

  /* Righe squadra e box elemento: larghezza flessibile, così fino a
     10 elementi entrano sempre in una riga sola (nessuno scroll),
     e con meno elementi i box restano grandi (fino a 150px). */
  .team-row-wrap{ padding: 14px 16px; gap: 8px; }
  .team-row-header{ gap: 8px; }
  .team-row-title{ font-size: 1rem; }
  .team-row-actions .btn{ padding: 8px 16px; font-size: 0.85rem; }
  .verify-result{ font-size: 0.85rem; }
  .order-track{ gap: 10px; padding: 4px 4px 8px; flex-wrap: nowrap; overflow-x: visible; }
  .order-item{
    width: auto;
    flex: 1 1 0;
    min-width: 0;
    max-width: 150px;
    padding: 10px;
    gap: 6px;
    border-radius: 14px;
  }
  .item-thumb{ width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 10px; }
  .thumb-fallback{ font-size: 2.2rem; }
  .item-name{ font-size: 0.8rem; line-height: 1.2; }
  .item-value{ font-size: 0.72rem; min-height: 1.2em; }

  /* Frecce di spostamento su ogni box: mouse, click o tastiera */
  .item-move-controls{ display: flex; gap: 5px; width: 100%; justify-content: center; }
  .move-btn{
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    width: 30px; height: 26px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .move-btn:hover:not(:disabled){ background: var(--accent); color: #06090f; border-color: var(--accent); }
  .move-btn:disabled{ opacity: 0.25; cursor: not-allowed; }
  .order-item:focus{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .order-item{ cursor: grab; }
  .order-item.revealed{ cursor: default; }

  .move-hint{ color: var(--text-muted); font-size: 0.85rem; text-align: center; }

  /* Righe di inserimento nomi squadra nella schermata di setup */
  .setup-row{ display: flex; gap: 10px; align-items: center; width: 100%; }
  .setup-row input{
    flex: 1;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
  }
  .setup-row input:focus{ outline: none; border-color: var(--accent); }
  .teams-setup{
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 480px;
  }

  /* Selettore "quanti elementi per round" */
  .count-grid{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 560px;
  }
  .count-card{
    background: var(--glass-bg);
    border: 2px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 22px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 1.15rem;
    min-width: 56px;
    text-align: center;
    transition: all 0.2s ease;
  }
  .count-card:hover, .count-card.selected{
    border-color: var(--accent);
    box-shadow: 0 0 24px -6px var(--accent-glow);
    background: var(--accent-soft);
  }
  .setup-section-title{ margin-top: 8px; }
</style>

<!-- ============ SCHERMATA DI SETUP ============ -->
<main class="stage" id="setupView">
  <h2 class="question-text">Quante squadre giocano?</h2>

  <div class="mode-grid" id="teamCountGrid">
    <div class="mode-card" data-count="1">1 Squadra</div>
    <div class="mode-card" data-count="2">2 Squadre</div>
    <div class="mode-card" data-count="3">3 Squadre</div>
    <div class="mode-card" data-count="4">4 Squadre</div>
  </div>

  <div class="teams-setup" id="teamsSetup" style="display:none;"></div>

  <h2 class="question-text setup-section-title">Quanti elementi per round?</h2>
  <div class="count-grid" id="itemsCountGrid">
    <div class="count-card" data-count="4">4</div>
    <div class="count-card" data-count="5">5</div>
    <div class="count-card selected" data-count="6">6</div>
    <div class="count-card" data-count="7">7</div>
    <div class="count-card" data-count="8">8</div>
    <div class="count-card" data-count="9">9</div>
    <div class="count-card" data-count="10">10</div>
  </div>

  <button class="btn btn-primary" id="startBtn" style="display:none;">INIZIA IL GIOCO ▶</button>
</main>

<!-- ============ SCHERMATA DI GIOCO ============ -->
<main class="stage" id="gameView" style="display:none;">

  <div class="score-grid readonly" id="scoreGrid"></div>

  <div class="question-card">
    <div class="question-eyebrow" id="categoryTitle">Categoria</div>
    <p class="question-text" id="categoryRule">Caricamento...</p>
  </div>

  <div class="order-hint" id="orderHint"><span>⬅</span><span>➡</span></div>
  <p class="move-hint">💡 Sposta i box trascinandoli con il mouse, con le frecce ◀ ▶ oppure selezionandoli e usando i tasti freccia della tastiera</p>

  <div id="rowsContainer" style="width:100%; display:flex; flex-direction:column; gap:12px;"></div>

  <div class="actions-row">
    <button class="btn btn-outline" id="revealBtn">👁 Mostra Soluzione (senza punto)</button>
    <button class="btn btn-primary" id="nextCategoryBtn">PROSSIMA CATEGORIA ▶</button>
    <button class="btn btn-outline" id="restartBtn">🔄 Nuova Partita</button>
  </div>
</main>

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function formatValue(value, unit){
    const numStr = Number.isInteger(value)
      ? value.toLocaleString("it-IT")
      : value.toString().replace(".", ",");
    return `${numStr} ${unit}`;
  }

  /* =========================================================
     STATO DI GIOCO
     ========================================================= */
  let teams = [];              // [{ name, score }]
  let itemsPerRound = 6;       // quanti elementi estrarre dal pool ad ogni round
  let catOrder = [];
  let catIndex = 0;
  let currentCategory = null;
  let roundItems = [];         // sottoinsieme di elementi estratto per il round corrente
  let solutionOrder = [];      // roundItems ordinati correttamente
  let rows = [];                // [{ order:[items], solved:bool }]
  let draggedInfo = null;       // { row, pos }

  /* ---- Elementi DOM ---- */
  const setupView = document.getElementById("setupView");
  const gameView = document.getElementById("gameView");
  const teamCountGrid = document.getElementById("teamCountGrid");
  const teamsSetup = document.getElementById("teamsSetup");
  const itemsCountGrid = document.getElementById("itemsCountGrid");
  const startBtn = document.getElementById("startBtn");
  const scoreGrid = document.getElementById("scoreGrid");
  const categoryTitle = document.getElementById("categoryTitle");
  const categoryRule = document.getElementById("categoryRule");
  const orderHint = document.getElementById("orderHint");
  const rowsContainer = document.getElementById("rowsContainer");
  const counter = document.getElementById("counter");
  const revealBtn = document.getElementById("revealBtn");
  const nextCategoryBtn = document.getElementById("nextCategoryBtn");
  const restartBtn = document.getElementById("restartBtn");

  /* ---- Selezione numero squadre ---- */
  teamCountGrid.addEventListener("click", (e) => {
    const card = e.target.closest(".mode-card");
    if (!card) return;
    teamCountGrid.querySelectorAll(".mode-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");

    const count = Number(card.dataset.count);
    teamsSetup.innerHTML = "";
    for (let i = 0; i < count; i++){
      const row = document.createElement("div");
      row.className = "setup-row";
      row.innerHTML = `<input type="text" value="Squadra ${i + 1}" maxlength="24">`;
      teamsSetup.appendChild(row);
    }
    teamsSetup.style.display = "flex";
    startBtn.style.display = "inline-block";
  });

  /* ---- Selezione numero elementi per round ---- */
  itemsCountGrid.addEventListener("click", (e) => {
    const card = e.target.closest(".count-card");
    if (!card) return;
    itemsCountGrid.querySelectorAll(".count-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    itemsPerRound = Number(card.dataset.count);
  });

  /* ---- Avvio partita ---- */
  startBtn.addEventListener("click", () => {
    const inputs = teamsSetup.querySelectorAll("input");
    teams = Array.from(inputs).map((input, i) => ({
      name: input.value.trim() || `Squadra ${i + 1}`,
      score: 0
    }));

    catOrder = shuffle([...CATEGORIES]);
    catIndex = 0;

    renderScoreboard();
    loadCategory();

    setupView.style.display = "none";
    gameView.style.display = "flex";
    counter.style.display = "inline-block";
  });

  /* ---- Tabellone punteggi (sola lettura + nome editabile) ---- */
  function renderScoreboard(){
    scoreGrid.innerHTML = "";
    teams.forEach((team, i) => {
      const card = document.createElement("div");
      card.className = "score-card";
      card.innerHTML = `
        <input class="team-name" type="text" value="${team.name}" data-index="${i}" maxlength="24">
        <div class="score-value" id="score-${i}">${team.score}</div>
      `;
      scoreGrid.appendChild(card);
    });
  }
  scoreGrid.addEventListener("change", (e) => {
    if (!e.target.classList.contains("team-name")) return;
    const i = Number(e.target.dataset.index);
    teams[i].name = e.target.value.trim() || `Squadra ${i + 1}`;
  });

  /* =========================================================
     CARICAMENTO CATEGORIA
     ========================================================= */
  function loadCategory(){
    currentCategory = catOrder[catIndex];
    counter.textContent = `Categoria ${catIndex + 1}/${catOrder.length}`;

    categoryTitle.textContent = currentCategory.title;
    categoryRule.textContent = currentCategory.rule;

    // Estrae N elementi casuali dal pool della categoria (N = itemsPerRound)
    const count = Math.min(itemsPerRound, currentCategory.items.length);
    roundItems = shuffle([...currentCategory.items]).slice(0, count);

    solutionOrder = [...roundItems].sort((a, b) =>
      currentCategory.order === "desc" ? b.value - a.value : a.value - b.value
    );

    orderHint.innerHTML = currentCategory.order === "desc"
      ? `<span>⬅ VALORE PIÙ ALTO</span><span>VALORE PIÙ BASSO ➡</span>`
      : `<span>⬅ VALORE PIÙ BASSO</span><span>VALORE PIÙ ALTO ➡</span>`;

    rows = teams.map(() => ({
      order: shuffle([...roundItems]),
      solved: false
    }));

    renderAllRows();
  }

  /* ---- Costruisce tutte le righe (una per squadra) da zero ---- */
  function renderAllRows(){
    rowsContainer.innerHTML = "";
    rows.forEach((row, rowIndex) => {
      const wrap = document.createElement("div");
      wrap.className = "team-row-wrap";
      wrap.innerHTML = `
        <div class="team-row-header">
          <span class="team-row-title">${teams[rowIndex].name}</span>
          <div class="team-row-actions">
            <span class="verify-result" id="verify-${rowIndex}"></span>
            <button class="btn btn-outline" data-action="verify" data-row="${rowIndex}">✅ VERIFICA POSIZIONI</button>
            <button class="btn btn-primary" data-action="assign" data-row="${rowIndex}">🏆 PUNTO &amp; SOLUZIONE</button>
          </div>
        </div>
        <div class="order-track" id="track-${rowIndex}"></div>
      `;
      rowsContainer.appendChild(wrap);

      const track = wrap.querySelector(`#track-${rowIndex}`);
      attachRowHandlers(track, rowIndex);
      renderRow(rowIndex);
    });

    rowsContainer.querySelectorAll('[data-action="verify"]').forEach(btn => {
      btn.addEventListener("click", () => verifyRow(Number(btn.dataset.row)));
    });
    rowsContainer.querySelectorAll('[data-action="assign"]').forEach(btn => {
      btn.addEventListener("click", () => assignPointAndReveal(Number(btn.dataset.row)));
    });
  }

  /* ---- Ridisegna gli item box di una singola riga ---- */
  function renderRow(rowIndex){
    const row = rows[rowIndex];
    const track = document.getElementById(`track-${rowIndex}`);
    track.innerHTML = "";

    row.order.forEach((item, pos) => {
      const box = document.createElement("div");
      box.className = "order-item" + (row.solved ? " revealed" : "");
      box.draggable = !row.solved;
      box.dataset.pos = pos;
      box.tabIndex = row.solved ? -1 : 0;

      const imgPath = `assets/img/${currentCategory.id}/${item.slug}.jpg`;
      const atStart = pos === 0;
      const atEnd = pos === row.order.length - 1;
      box.innerHTML = `
        <div class="item-move-controls">
          <button class="move-btn" data-dir="-1" aria-label="Sposta a sinistra" ${row.solved || atStart ? "disabled" : ""}>◀</button>
          <button class="move-btn" data-dir="1" aria-label="Sposta a destra" ${row.solved || atEnd ? "disabled" : ""}>▶</button>
        </div>
        <div class="item-thumb">
          <img src="${imgPath}" alt="${item.name}"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="thumb-fallback">🖼️</div>
        </div>
        <div class="item-name">${item.name}</div>
        <div class="item-value">${row.solved ? formatValue(item.value, currentCategory.unit) : "&nbsp;"}</div>
      `;
      track.appendChild(box);
    });
  }

  /* ---- Sposta un elemento di una posizione (usato da pulsanti e frecce) ---- */
  function moveItem(rowIndex, fromPos, dir){
    const row = rows[rowIndex];
    if (row.solved) return;
    const toPos = fromPos + dir;
    if (toPos < 0 || toPos >= row.order.length) return;

    const [moved] = row.order.splice(fromPos, 1);
    row.order.splice(toPos, 0, moved);
    renderRow(rowIndex);

    const track = document.getElementById(`track-${rowIndex}`);
    const newBox = track.children[toPos];
    if (newBox) newBox.focus();
  }

  /* ---- Riordino: trascinamento mouse, pulsanti ◀▶ e frecce da tastiera ---- */
  function attachRowHandlers(track, rowIndex){
    // Drag & drop con il mouse
    track.addEventListener("dragstart", (e) => {
      const box = e.target.closest(".order-item");
      if (!box || rows[rowIndex].solved) return;
      draggedInfo = { row: rowIndex, pos: Number(box.dataset.pos) };
      box.classList.add("dragging");
    });
    track.addEventListener("dragend", (e) => {
      const box = e.target.closest(".order-item");
      if (box) box.classList.remove("dragging");
    });
    track.addEventListener("dragover", (e) => e.preventDefault());
    track.addEventListener("drop", (e) => {
      e.preventDefault();
      if (!draggedInfo || draggedInfo.row !== rowIndex) return;

      const targetBox = e.target.closest(".order-item");
      const row = rows[rowIndex];
      const fromPos = draggedInfo.pos;
      const toPos = targetBox ? Number(targetBox.dataset.pos) : row.order.length - 1;
      draggedInfo = null;
      if (fromPos === toPos) return;

      const [moved] = row.order.splice(fromPos, 1);
      row.order.splice(toPos, 0, moved);
      renderRow(rowIndex);
    });

    // Pulsanti ◀ ▶ su ogni box
    track.addEventListener("click", (e) => {
      const btn = e.target.closest(".move-btn");
      if (!btn || btn.disabled) return;
      const box = btn.closest(".order-item");
      moveItem(rowIndex, Number(box.dataset.pos), Number(btn.dataset.dir));
    });

    // Frecce da tastiera: seleziona un box (click o Tab) e usa ← →
    track.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      const box = e.target.closest(".order-item");
      if (!box) return;
      e.preventDefault();
      moveItem(rowIndex, Number(box.dataset.pos), e.key === "ArrowLeft" ? -1 : 1);
    });
  }

  /* ---- Verifica posizioni: mostra solo il numero di errori ---- */
  function verifyRow(rowIndex){
    const row = rows[rowIndex];
    let errors = 0;
    row.order.forEach((item, pos) => {
      if (item.slug !== solutionOrder[pos].slug) errors++;
    });

    const verifyEl = document.getElementById(`verify-${rowIndex}`);
    if (errors === 0){
      verifyEl.textContent = "🎉 Ordine perfetto!";
      verifyEl.classList.add("correct");
    } else {
      verifyEl.textContent = `${errors} element${errors === 1 ? "o" : "i"} fuori posto`;
      verifyEl.classList.remove("correct");
    }
  }

  /* ---- Assegna il punto alla squadra e rivela la soluzione per tutti ---- */
  function assignPointAndReveal(rowIndex){
    teams[rowIndex].score++;
    document.getElementById(`score-${rowIndex}`).textContent = teams[rowIndex].score;
    revealAll();
  }

  /* ---- Rivela la soluzione (dati reali) su tutte le righe ---- */
  function revealAll(){
    rows.forEach((row, i) => {
      row.solved = true;
      renderRow(i);
    });
  }
  revealBtn.addEventListener("click", revealAll);

  /* ---- Prossima categoria ---- */
  nextCategoryBtn.addEventListener("click", () => {
    catIndex++;
    if (catIndex >= catOrder.length){
      catOrder = shuffle([...CATEGORIES]);
      catIndex = 0;
    }
    loadCategory();
  });

  /* ---- Nuova partita: torna al setup ---- */
  restartBtn.addEventListener("click", () => {
    gameView.style.display = "none";
    counter.style.display = "none";
    teamCountGrid.querySelectorAll(".mode-card").forEach(c => c.classList.remove("selected"));
    teamsSetup.style.display = "none";
    startBtn.style.display = "none";
    setupView.style.display = "flex";
  });
