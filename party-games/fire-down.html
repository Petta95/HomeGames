  /* Righe di inserimento giocatori nella schermata di setup */
  .players-setup{
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 480px;

    padding: 14px 16px;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;

  .player-row input:focus{ outline: none; border-color: var(--accent); }
  .player-row button{
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    color: var(--text-muted);
    border-radius: 10px;
    width: 42px;
    height: 42px;
    cursor: pointer;
    font-size: 1.1rem;
  }
  .player-row button:hover{ color: #ff2d55; border-color: #ff2d55; }
  #addPlayerBtn{
    align-self: center;
    background: var(--glass-bg);
    border: 1px dashed var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .timer-hint{ color: var(--text-muted); font-size: 0.95rem; }

<!-- ============ SCHERMATA DI GIOCO ============ -->
<main class="stage" id="gameView" style="display:none;">
  <div class="question-card">
    <div class="question-eyebrow">Categoria</div>
    <p class="question-text" id="categoryText">Caricamento...</p>
  </div>

  <div class="fire-timer-circle" id="timerCircle">5</div>

  <div class="chip-grid" id="playersGrid"></div>

  <div class="info-box">
    👆 Clicca sul nome di un giocatore per segnarlo come <strong>ELIMINATO</strong> (ri-clicca per riportarlo in gioco).
  </div>

  <div class="actions-row">
    <button class="btn btn-outline" id="timerBtn">⏱ START TIMER (5s)</button>
    <button class="btn btn-primary" id="nextCategoryBtn">PROSSIMA CATEGORIA ▶</button>
  </div>

  <button class="btn btn-outline" id="restartBtn">🔄 Nuova Partita</button>
</main>

<!-- Overlay vincitore -->
<div class="timer-overlay" id="winnerOverlay">
  <div class="timer-number" id="winnerText" style="font-size: clamp(2rem,7vw,4.5rem);">🏆</div>
  <div class="timer-label" id="winnerLabel">Vincitore!</div>

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* ---- Squadre globali (nomi/colori/punteggio impostati in index.html) ----
     I partecipanti di Fire Down sono le squadre globali: niente più scelta
     giocatori qui, e chi vince la partita guadagna un punto nel totale. */
  const GLOBAL_TEAMS_KEY = "homeGamesTeams";
  function loadGlobalTeams(){
    try {
      const raw = localStorage.getItem(GLOBAL_TEAMS_KEY);
      if (raw){
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.teams) && data.teams.length >= 2) return data;
      }
    } catch(e) { /* dati corrotti: si ignora */ }
    return null;
  }
  function addGlobalPoint(index){
    const data = loadGlobalTeams();
    if (!data || !data.teams[index]) return;
    data.teams[index].score = (data.teams[index].score || 0) + 1;
    localStorage.setItem(GLOBAL_TEAMS_KEY, JSON.stringify(data));
    if (window.renderGlobalScoreWidget) window.renderGlobalScoreWidget();
  }

  let players = [];        // [{ name, color, eliminated }]
  let catOrder = [];
  let catIndex = 0;
  let timerInterval = null;

  /* ---- Elementi DOM ---- */
  const gameView = document.getElementById("gameView");
  const categoryText = document.getElementById("categoryText");
  const playersGrid = document.getElementById("playersGrid");
  const counter = document.getElementById("counter");
  const timerBtn = document.getElementById("timerBtn");
  const timerCircle = document.getElementById("timerCircle");
  const nextCategoryBtn = document.getElementById("nextCategoryBtn");
  const restartBtn = document.getElementById("restartBtn");
  const winnerOverlay = document.getElementById("winnerOverlay");
  const winnerLabel = document.getElementById("winnerLabel");
  const winnerRestartBtn = document.getElementById("winnerRestartBtn");

  /* ---- Avvio partita: partecipanti = squadre globali ---- */
  function buildPlayersFromGlobal(){
    const global = loadGlobalTeams();
    if (global){
      const n = global.count || global.teams.length;
      return global.teams.slice(0, n).map(t => ({ name: t.name, color: t.color, eliminated: false }));
    }
    return [
      { name: "Giocatore 1", eliminated: false },
      { name: "Giocatore 2", eliminated: false }
    ];
  }

  function startGame(){
    players = buildPlayersFromGlobal();
    catOrder = shuffle([...CATEGORIES]);
    catIndex = 0;

    renderPlayers();
    showCategory();
    resetTimerDisplay();

    gameView.style.display = "flex";
    counter.style.display = "inline-block";
  }

  /* ---- Griglia giocatori con toggle eliminazione ---- */
  function renderPlayers(){
    playersGrid.innerHTML = "";
    players.forEach((p, i) => {
      const chip = document.createElement("div");
      chip.className = "player-chip" + (p.eliminated ? " eliminated" : "");
      chip.textContent = p.eliminated ? `${p.name} ❌` : p.name;
      if (p.color && !p.eliminated) chip.style.borderColor = p.color;
      chip.dataset.index = i;
      playersGrid.appendChild(chip);
    });
    const remaining = players.filter(p => !p.eliminated).length;
    counter.textContent = `Giocatori rimasti: ${remaining}/${players.length}`;
    checkWinner(remaining);
  }

  playersGrid.addEventListener("click", (e) => {
    const chip = e.target.closest(".player-chip");
    if (!chip) return;
    const i = Number(chip.dataset.index);
    players[i].eliminated = !players[i].eliminated;
    renderPlayers();
  });

  let winAwarded = false;
  function checkWinner(remaining){
    if (players.length >= 2 && remaining === 1 && !winAwarded){
      winAwarded = true;
      const winnerIndex = players.findIndex(p => !p.eliminated);
      const winner = players[winnerIndex];
      winnerLabel.textContent = `🏆 ${winner.name} VINCE LA PARTITA!`;
      winnerOverlay.classList.add("active");
      addGlobalPoint(winnerIndex);
    }
  }

  /* ---- Navigazione categorie ---- */
  function showCategory(){
    categoryText.textContent = catOrder[catIndex];
  }
  nextCategoryBtn.addEventListener("click", () => {
    catIndex++;
    if (catIndex >= catOrder.length){
      catOrder = shuffle([...CATEGORIES]);
      catIndex = 0;
    }
    showCategory();
    resetTimerDisplay();
  });

  /* =========================================================
     TIMER 5 SECONDI con cambio colore e beep
     ========================================================= */
  function beep(freq, duration){
    try{
      const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e){ /* Web Audio non disponibile: si prosegue senza audio */ }
  }

  function resetTimerDisplay(){
    if (timerInterval) clearInterval(timerInterval);
    timerCircle.textContent = "5";
    timerCircle.classList.remove("warn", "danger");
    timerBtn.disabled = false;
  }

  timerBtn.addEventListener("click", () => {
    timerBtn.disabled = true;
    let secondsLeft = 5;
    timerCircle.classList.remove("warn", "danger");
    timerCircle.textContent = secondsLeft;
    beep(523, 0.15);

    timerInterval = setInterval(() => {
      secondsLeft--;
      if (secondsLeft > 0){
        timerCircle.textContent = secondsLeft;
        if (secondsLeft <= 2){ timerCircle.classList.add("danger"); timerCircle.classList.remove("warn"); }
        else if (secondsLeft <= 3){ timerCircle.classList.add("warn"); }
        beep(secondsLeft <= 2 ? 660 : 523, 0.15);
      } else {
        clearInterval(timerInterval);
        timerCircle.textContent = "🔥";
        timerCircle.classList.add("danger");
        beep(220, 0.4);
        setTimeout(() => {
          timerBtn.disabled = false;
        }, 800);
      }
    }, 1000);
  });

  /* ---- Nuova partita: si riparte subito con le stesse squadre globali ---- */
  function goToSetup(){
    if (timerInterval) clearInterval(timerInterval);
    winnerOverlay.classList.remove("active");
    winAwarded = false;
    startGame();
  }
  restartBtn.addEventListener("click", goToSetup);
  winnerRestartBtn.addEventListener("click", goToSetup);

  startGame();
</script>


<!-- ============================================================
     WIDGET PUNTEGGIO GLOBALE — visibile in ogni gioco, legge/scrive
     la stessa chiave localStorage impostata in index.html. Non
     dipende dalle variabili interne del gioco che lo ospita.
     ============================================================ -->
<div id="globalScoreWidget" class="global-score-widget"></div>
<style>
  .global-score-widget{
    position: fixed; bottom: 14px; right: 14px; z-index: 99999;
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    font-family: 'Inter', sans-serif; pointer-events: none;
  }
  .global-score-widget > *{ pointer-events: auto; }
  .gsw-team{
    display: flex; align-items: center; gap: 6px;
    background: rgba(8,10,20,0.88); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; padding: 5px 8px 5px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px -4px rgba(0,0,0,0.5);
    font-size: 0.76rem; color: #fff; white-space: nowrap;
  }
  .gsw-dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .gsw-name{ font-weight: 700; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .gsw-score{ font-weight: 900; font-family: 'Poppins', sans-serif; min-width: 18px; text-align: center; }
  .gsw-btn{
    width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; font-size: 0.72rem;
    display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0;
    transition: background 0.15s ease;
  }
  .gsw-btn:hover{ background: rgba(255,255,255,0.32); }
  .gsw-reset{
    font-size: 0.65rem; color: rgba(255,255,255,0.55);
    background: rgba(8,10,20,0.7); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; cursor: pointer; padding: 3px 10px;
  }
  .gsw-reset:hover{ color: #fff; border-color: rgba(255,255,255,0.3); }
  @media (max-width: 560px){
    .global-score-widget{ bottom: 8px; right: 8px; }
    .gsw-name{ max-width: 72px; }
  }
</style>
<script>
(function(){
  var KEY = "homeGamesTeams";
  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw){
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.teams) && d.teams.length >= 2) return d;
      }
    } catch(e) {}
    return null;
  }
  function save(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  function esc(s){
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }
  window.renderGlobalScoreWidget = function(){
    var el = document.getElementById("globalScoreWidget");
    if (!el) return;
    var data = load();
    if (!data){ el.innerHTML = ""; return; }
    var n = data.count || data.teams.length;
    var html = data.teams.slice(0, n).map(function(t, i){
      return '<div class="gsw-team">' +
        '<span class="gsw-dot" style="background:' + esc(t.color || "#4dd9ff") + '"></span>' +
        '<span class="gsw-name">' + esc(t.name) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="-1" aria-label="Togli un punto">−</button>' +
        '<span class="gsw-score">' + (t.score || 0) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="1" aria-label="Aggiungi un punto">+</button>' +
      '</div>';
    }).join("");
    html += '<button type="button" class="gsw-reset" id="gswResetBtn">azzera punteggi</button>';
    el.innerHTML = html;
  };
  document.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest(".gsw-btn") : null;
    if (btn){
      var data = load();
      if (!data) return;
      var i = Number(btn.getAttribute("data-gsw-i"));
      var d = Number(btn.getAttribute("data-gsw-d"));
      if (!data.teams[i]) return;
      data.teams[i].score = Math.max(0, (data.teams[i].score || 0) + d);
      save(data);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
      return;
    }
    if (e.target && e.target.id === "gswResetBtn"){
      var data2 = load();
      if (!data2) return;
      if (!confirm("Azzerare il punteggio di tutte le squadre?")) return;
      data2.teams.forEach(function(t){ t.score = 0; });
      save(data2);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
    }
  });
  window.renderGlobalScoreWidget();
})();
</script>
