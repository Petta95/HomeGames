<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire Down — Party Games Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">

<style>
  /* Righe di inserimento giocatori nella schermata di setup */
  .players-setup{
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 480px;
  }
  .player-row{ display: flex; gap: 10px; align-items: center; }
  .player-row input{
    flex: 1;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
  }
  .player-row input:focus{ outline: none; border-color: var(--accent); }
  .player-row button{
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    color: var(--text-muted);
    border-radius: 10px;
    width: 42px;
    height: 42px;
    cursor: pointer;
    font-size: 1.1rem;
  }
  .player-row button:hover{ color: #ff2d55; border-color: #ff2d55; }
  #addPlayerBtn{
    align-self: center;
    background: var(--glass-bg);
    border: 1px dashed var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .timer-hint{ color: var(--text-muted); font-size: 0.95rem; }

  /* Selettori Livello e Timer */
  .fd-options{ display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .seg{
    display: inline-flex; align-items: center; gap: 4px; padding: 4px;
    background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 999px;
  }
  .seg-label{ font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); padding: 0 8px 0 10px; }
  .seg-btn{
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 0.88rem;
    color: var(--text-muted); background: transparent; border: none;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: background 0.2s ease, color 0.2s ease;
  }
  .seg-btn:hover{ color: #f2f4ff; }
  .seg-btn.active{ background: var(--accent); color: #06090f; }
</style>
</head>
<body class="theme-green">

<div class="bg-blobs"><span></span><span></span></div>

<nav class="navbar">
  <a class="nav-back" href="menu.html">← Menu</a>
  <span class="nav-title"><span class="dot"></span>🔥 Fire Down</span>
  <span class="nav-counter" id="counter" style="display:none;">Giocatori: 0</span>
</nav>

<!-- ============ SCHERMATA DI GIOCO ============ -->
<main class="stage" id="gameView" style="display:none;">
  <div class="fd-options">
    <div class="seg" role="group" aria-label="Livello categorie">
      <span class="seg-label">Livello</span>
      <button type="button" class="seg-btn active" data-level="tutte">Tutte</button>
      <button type="button" class="seg-btn" data-level="classiche">Classiche</button>
      <button type="button" class="seg-btn" data-level="difficili">🧠 Difficili</button>
    </div>
    <div class="seg" role="group" aria-label="Durata timer">
      <span class="seg-label">Timer</span>
      <button type="button" class="seg-btn" data-sec="10">10s</button>
      <button type="button" class="seg-btn active" data-sec="15">15s</button>
      <button type="button" class="seg-btn" data-sec="20">20s</button>
    </div>
  </div>

  <div class="question-card">
    <div class="question-eyebrow">Categoria</div>
    <p class="question-text" id="categoryText">Caricamento...</p>
  </div>

  <div class="fire-timer-circle" id="timerCircle">15</div>

  <div class="chip-grid" id="playersGrid"></div>

  <div class="info-box">
    👆 Clicca sul nome di un giocatore per segnarlo come <strong>ELIMINATO</strong> (ri-clicca per riportarlo in gioco).
  </div>

  <div class="actions-row">
    <button class="btn btn-outline" id="timerBtn">⏱ START TIMER (15s)</button>
    <button class="btn btn-primary" id="nextCategoryBtn">PROSSIMA CATEGORIA ▶</button>
  </div>

  <button class="btn btn-outline" id="restartBtn">🔄 Nuova Partita</button>
</main>

<!-- Overlay vincitore -->
<div class="timer-overlay" id="winnerOverlay">
  <div class="timer-number" id="winnerText" style="font-size: clamp(2rem,7vw,4.5rem);">🏆</div>
  <div class="timer-label" id="winnerLabel">Vincitore!</div>
  <button class="btn btn-primary" id="winnerRestartBtn" style="margin-top: 20px;">🔄 Nuovo Round</button>
</div>

  /* =========================================================

  const LEVELS = {
    tutte: () => [...CATEGORIES, ...HARD_CATEGORIES],
    classiche: () => [...CATEGORIES],
    difficili: () => [...HARD_CATEGORIES]
  };
  let level = "tutte";

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /* ---- Squadre globali (nomi/colori/punteggio impostati in index.html) ----
     I partecipanti di Fire Down sono le squadre globali: niente più scelta
     giocatori qui, e chi vince la partita guadagna un punto nel totale. */
  const GLOBAL_TEAMS_KEY = "homeGamesTeams";
  function loadGlobalTeams(){
    try {
      const raw = localStorage.getItem(GLOBAL_TEAMS_KEY);
      if (raw){
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.teams) && data.teams.length >= 2) return data;
      }
    } catch(e) { /* dati corrotti: si ignora */ }
    return null;
  }
  function addGlobalPoint(index){
    const data = loadGlobalTeams();
    if (!data || !data.teams[index]) return;
    data.teams[index].score = (data.teams[index].score || 0) + 1;
    localStorage.setItem(GLOBAL_TEAMS_KEY, JSON.stringify(data));
    if (window.renderGlobalScoreWidget) window.renderGlobalScoreWidget();
  }

  let players = [];        // [{ name, color, eliminated }]
  let catOrder = [];
  let catIndex = 0;
  let timerInterval = null;

  /* ---- Elementi DOM ---- */
  const gameView = document.getElementById("gameView");
  const categoryText = document.getElementById("categoryText");
  const playersGrid = document.getElementById("playersGrid");
  const counter = document.getElementById("counter");
  const timerBtn = document.getElementById("timerBtn");
  const timerCircle = document.getElementById("timerCircle");
  const nextCategoryBtn = document.getElementById("nextCategoryBtn");
  const restartBtn = document.getElementById("restartBtn");
  const winnerOverlay = document.getElementById("winnerOverlay");
  const winnerLabel = document.getElementById("winnerLabel");
  const winnerRestartBtn = document.getElementById("winnerRestartBtn");

  /* ---- Avvio partita: partecipanti = squadre globali ---- */
  function buildPlayersFromGlobal(){
    const global = loadGlobalTeams();
    if (global){
      const n = global.count || global.teams.length;
      return global.teams.slice(0, n).map(t => ({ name: t.name, color: t.color, eliminated: false }));
    }
    return [
      { name: "Giocatore 1", eliminated: false },
      { name: "Giocatore 2", eliminated: false }
    ];
  }

  function startGame(){
    players = buildPlayersFromGlobal();
    catOrder = shuffle(LEVELS[level]());
    catIndex = 0;

    renderPlayers();
    showCategory();
    resetTimerDisplay();

    gameView.style.display = "flex";
    counter.style.display = "inline-block";
  }

  /* ---- Griglia giocatori con toggle eliminazione ---- */
  function renderPlayers(){
    playersGrid.innerHTML = "";
    players.forEach((p, i) => {
      const chip = document.createElement("div");
      chip.className = "player-chip" + (p.eliminated ? " eliminated" : "");
      chip.textContent = p.eliminated ? `${p.name} ❌` : p.name;
      if (p.color && !p.eliminated) chip.style.borderColor = p.color;
      chip.dataset.index = i;
      playersGrid.appendChild(chip);
    });
    const remaining = players.filter(p => !p.eliminated).length;
    counter.textContent = `Giocatori rimasti: ${remaining}/${players.length}`;
    checkWinner(remaining);
  }

  playersGrid.addEventListener("click", (e) => {
    const chip = e.target.closest(".player-chip");
    if (!chip) return;
    const i = Number(chip.dataset.index);
    players[i].eliminated = !players[i].eliminated;
    renderPlayers();
  });

  let winAwarded = false;
  function checkWinner(remaining){
    if (players.length >= 2 && remaining === 1 && !winAwarded){
      winAwarded = true;
      const winnerIndex = players.findIndex(p => !p.eliminated);
      const winner = players[winnerIndex];
      winnerLabel.textContent = `🏆 ${winner.name} vince il round! +1 punto match`;
      winnerOverlay.classList.add("active");
      addGlobalPoint(winnerIndex);   // +1 punto match
    }
  }

  /* ---- Navigazione categorie ---- */
  function showCategory(){
    categoryText.textContent = catOrder[catIndex];
  }
  nextCategoryBtn.addEventListener("click", () => {
    catIndex++;
    if (catIndex >= catOrder.length){
      catOrder = shuffle(LEVELS[level]());
      catIndex = 0;
    }
    showCategory();
    resetTimerDisplay();
  });

  /* =========================================================
     TIMER 15 SECONDI con cambio colore e beep
     ========================================================= */
  let TIMER_SECONDS = 15;   // regolabile dal selettore Timer (10 / 15 / 20 s)
  function beep(freq, duration){
    try{
      const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e){ /* Web Audio non disponibile: si prosegue senza audio */ }
  }

  function resetTimerDisplay(){
    if (timerInterval) clearInterval(timerInterval);
    timerCircle.textContent = TIMER_SECONDS;
    timerCircle.classList.remove("warn", "danger");
    timerBtn.disabled = false;
  }

  /* ---- Selettori: livello delle categorie e durata del timer ---- */
  document.querySelectorAll(".seg-btn[data-level]").forEach(btn => btn.addEventListener("click", () => {
    level = btn.dataset.level;
    document.querySelectorAll(".seg-btn[data-level]").forEach(b => b.classList.toggle("active", b === btn));
    catOrder = shuffle(LEVELS[level]());
    catIndex = 0;
    showCategory();
    resetTimerDisplay();
  }));
  document.querySelectorAll(".seg-btn[data-sec]").forEach(btn => btn.addEventListener("click", () => {
    TIMER_SECONDS = Number(btn.dataset.sec);
    document.querySelectorAll(".seg-btn[data-sec]").forEach(b => b.classList.toggle("active", b === btn));
    timerBtn.textContent = `⏱ START TIMER (${TIMER_SECONDS}s)`;
    resetTimerDisplay();
  }));

  timerBtn.addEventListener("click", () => {
    timerBtn.disabled = true;
    let secondsLeft = TIMER_SECONDS;
    timerCircle.classList.remove("warn", "danger");
    timerCircle.textContent = secondsLeft;
    beep(523, 0.15);

    timerInterval = setInterval(() => {
      secondsLeft--;
      if (secondsLeft > 0){
        timerCircle.textContent = secondsLeft;
        if (secondsLeft <= 3){ timerCircle.classList.add("danger"); timerCircle.classList.remove("warn"); }
        else if (secondsLeft <= 5){ timerCircle.classList.add("warn"); }
        // beep solo negli ultimi 5 secondi, per non stordire
        if (secondsLeft <= 5) beep(secondsLeft <= 3 ? 660 : 523, 0.15);
      } else {
        clearInterval(timerInterval);
        timerCircle.textContent = "🔥";
        timerCircle.classList.add("danger");
        beep(220, 0.4);
        setTimeout(() => {
          timerBtn.disabled = false;
        }, 800);
      }
    }, 1000);
  });

  /* ---- Nuova partita: si riparte subito con le stesse squadre globali ---- */
  function goToSetup(){
    if (timerInterval) clearInterval(timerInterval);
    winnerOverlay.classList.remove("active");
    winAwarded = false;
    startGame();
  }
  restartBtn.addEventListener("click", goToSetup);
  winnerRestartBtn.addEventListener("click", goToSetup);

  startGame();
</script>


<!-- ============================================================
     WIDGET PUNTEGGIO GLOBALE — visibile in ogni gioco, legge/scrive
     la stessa chiave localStorage impostata in index.html. Non
     dipende dalle variabili interne del gioco che lo ospita.
     Per ogni squadra: punti match (score, sommati dai giochi) e
     punti gioco 🏆 (gamePoints). I punti gioco aumentano SOLO col
     pulsante "🏁 Termina Partita" (+1 a chi ha più punti match) oppure
     a mano con + / −. I punti match si azzerano tornando al menu;
     "azzera punti match" azzera solo quelli, mai i punti gioco.
     ============================================================ -->
<div id="globalScoreWidget" class="global-score-widget"></div>
<style>
  .global-score-widget{
    position: fixed; bottom: 14px; right: 14px; z-index: 99999;
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    font-family: 'Inter', sans-serif; pointer-events: none;
  }
  .global-score-widget > *{ pointer-events: auto; }
  .gsw-team{
    display: flex; align-items: center; gap: 6px;
    background: rgba(8,10,20,0.88); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; padding: 5px 8px 5px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px -4px rgba(0,0,0,0.5);
    font-size: 0.76rem; color: #fff; white-space: nowrap;
  }
  .gsw-dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .gsw-name{ font-weight: 700; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .gsw-score{ font-weight: 900; font-family: 'Poppins', sans-serif; min-width: 18px; text-align: center; }
  .gsw-btn{
    width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; font-size: 0.72rem;
    display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0;
    transition: background 0.15s ease;
  }
  .gsw-btn:hover{ background: rgba(255,255,255,0.32); }
  .gsw-game{
    display: flex; align-items: center; gap: 4px;
    margin-left: 2px; padding: 2px 4px 2px 7px; border-radius: 999px;
    background: rgba(255,194,71,0.14); border: 1px solid rgba(255,194,71,0.45);
  }
  .gsw-game .gsw-score{ color: #ffc247; min-width: 14px; }
  .gsw-game .gsw-btn{ background: rgba(255,194,71,0.22); color: #ffd98a; }
  .gsw-game .gsw-btn:hover{ background: rgba(255,194,71,0.5); color: #fff; }
  .gsw-game-ico{ font-size: 0.78rem; line-height: 1; }
  .gsw-reset{
    font-size: 0.65rem; color: rgba(255,255,255,0.55);
    background: rgba(8,10,20,0.7); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; cursor: pointer; padding: 3px 10px;
  }
  .gsw-reset:hover{ color: #fff; border-color: rgba(255,255,255,0.3); }
  .gsw-end{
    font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 0.78rem; letter-spacing: 0.02em;
    color: #fff; background: linear-gradient(135deg, #ff3b5c, #ff8a3d);
    border: none; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    box-shadow: 0 6px 18px -4px rgba(255,59,92,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .gsw-end:hover{ transform: translateY(-1px) scale(1.03); box-shadow: 0 8px 22px -4px rgba(255,59,92,0.8); }
  .gsw-end-overlay{
    position: fixed; inset: 0; z-index: 100000;
    display: none; align-items: center; justify-content: center; padding: 16px;
    background: rgba(4,6,14,0.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-family: 'Inter', sans-serif; color: #fff;
  }
  .gsw-end-overlay.show{ display: flex; }
  .gsw-end-card{
    width: min(440px, 100%); text-align: center;
    background: #0d1222; border: 1px solid rgba(255,194,71,0.5); border-radius: 22px;
    padding: 26px 22px 20px; box-shadow: 0 24px 70px rgba(0,0,0,0.6);
  }
  .gsw-end-trophy{ font-size: 3.4rem; line-height: 1; filter: drop-shadow(0 0 20px rgba(255,194,71,0.6)); }
  .gsw-end-title{ font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 1.45rem; margin: 10px 0 4px; }
  .gsw-end-sub{ color: #ffc247; font-weight: 700; font-size: 0.95rem; }
  .gsw-end-list{ margin: 16px 0 18px; display: flex; flex-direction: column; gap: 6px; }
  .gsw-end-row{
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 0.9rem;
  }
  .gsw-end-row.win{ border-color: rgba(255,194,71,0.7); background: rgba(255,194,71,0.1); }
  .gsw-end-row > span:last-child{ font-family: 'Poppins', sans-serif; font-weight: 800; color: rgba(255,255,255,0.8); }
  .gsw-end-actions{ display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .gsw-end-actions a, .gsw-end-actions button{
    font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 0.88rem;
    border-radius: 999px; padding: 10px 18px; cursor: pointer; text-decoration: none;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff;
  }
  .gsw-end-actions a{ background: #ffc247; color: #06090f; border-color: #ffc247; }
  .gsw-flash{ animation: gswFlash 0.7s ease; }
  @keyframes gswFlash{ 0%{ box-shadow: 0 0 0 0 rgba(255,194,71,0.9); } 100%{ box-shadow: 0 0 0 12px rgba(255,194,71,0); } }
  @media (max-width: 560px){
    .global-score-widget{ bottom: 8px; right: 8px; }
    .gsw-name{ max-width: 72px; }
  }
</style>
<script>
(function(){
  var KEY = "homeGamesTeams";
  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw){
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.teams) && d.teams.length >= 2) return d;
      }
    } catch(e) {}
    return null;
  }
  function save(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  function esc(s){
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }
  var flashIndex = -1;
  window.renderGlobalScoreWidget = function(){
    var el = document.getElementById("globalScoreWidget");
    if (!el) return;
    var data = load();
    if (!data){ el.innerHTML = ""; return; }
    var n = data.count || data.teams.length;
    var html = data.teams.slice(0, n).map(function(t, i){
      return '<div class="gsw-team">' +
        '<span class="gsw-dot" style="background:' + esc(t.color || "#4dd9ff") + '"></span>' +
        '<span class="gsw-name">' + esc(t.name) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="-1" aria-label="Togli un punto match">−</button>' +
        '<span class="gsw-score" title="Punti match">' + (t.score || 0) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="1" aria-label="Aggiungi un punto match">+</button>' +
        '<span class="gsw-game' + (i === flashIndex ? ' gsw-flash' : '') + '" title="Punti gioco: 1 punto alla squadra che vince un gioco">' +
          '<span class="gsw-game-ico">🏆</span>' +
          '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-g="-1" aria-label="Togli un punto gioco">−</button>' +
          '<span class="gsw-score">' + (t.gamePoints || 0) + '</span>' +
          '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-g="1" aria-label="Aggiungi un punto gioco">+</button>' +
        '</span>' +
      '</div>';
    }).join("");
    html += '<button type="button" class="gsw-reset" id="gswResetBtn">azzera punti match</button>';
    if (!el.hasAttribute("data-gsw-hub"))
      html = '<button type="button" class="gsw-end" id="gswEndBtn">🏁 Termina Partita</button>' + html;
    el.innerHTML = html;
    flashIndex = -1;
  };
  document.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest(".gsw-btn") : null;
    if (btn){
      var data = load();
      if (!data) return;
      var i = Number(btn.getAttribute("data-gsw-i"));
      if (!data.teams[i]) return;
      if (btn.hasAttribute("data-gsw-g")){
        var g = Number(btn.getAttribute("data-gsw-g"));
        data.teams[i].gamePoints = Math.max(0, (data.teams[i].gamePoints || 0) + g);
        if (g > 0) flashIndex = i;
      } else {
        var d = Number(btn.getAttribute("data-gsw-d"));
        data.teams[i].score = Math.max(0, (data.teams[i].score || 0) + d);
      }
      save(data);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
      return;
    }
    if (e.target && e.target.id === "gswEndBtn"){ terminaPartita(); return; }
    if (e.target && e.target.id === "gswEndStay"){ document.getElementById("gswEndOverlay").classList.remove("show"); return; }
    if (e.target && e.target.id === "gswResetBtn"){
      var data2 = load();
      if (!data2) return;
      if (!confirm("Azzerare i punti match di tutte le squadre? (i punti gioco 🏆 restano)")) return;
      data2.teams.forEach(function(t){ t.score = 0; });
      save(data2);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
    }
  });
  /* 🏁 Termina Partita: +1 punto gioco a chi ha più punti match (a tutti i primi se pari) */
  function terminaPartita(){
    var data = load();
    if (!data) return;
    var n = data.count || data.teams.length;
    var teams = data.teams.slice(0, n);
    var top = Math.max.apply(null, teams.map(function(t){ return t.score || 0; }));
    if (top <= 0){ flashEndBtn("Nessun punto match ancora"); return; }
    var winners = [];
    teams.forEach(function(t, i){
      if ((t.score || 0) === top){ t.gamePoints = (t.gamePoints || 0) + 1; winners.push(i); flashIndex = i; }
    });
    save(data);
    window.renderGlobalScoreWidget();
    showEndOverlay(teams, winners, top);
    window.dispatchEvent(new CustomEvent("gameTerminated", { detail: { winners: winners } }));
  }
  window.terminaPartita = terminaPartita;
  function flashEndBtn(msg){
    var b = document.getElementById("gswEndBtn");
    if (!b) return;
    b.textContent = msg;
    setTimeout(function(){ var b2 = document.getElementById("gswEndBtn"); if (b2) b2.textContent = "🏁 Termina Partita"; }, 1800);
  }
  function showEndOverlay(teams, winners, top){
    var ov = document.getElementById("gswEndOverlay");
    if (!ov){
      ov = document.createElement("div");
      ov.id = "gswEndOverlay"; ov.className = "gsw-end-overlay";
      document.body.appendChild(ov);
    }
    var names = winners.map(function(i){ return esc(teams[i].name); });
    var order = teams.map(function(t, i){ return i; }).sort(function(a, b){ return (teams[b].score || 0) - (teams[a].score || 0); });
    ov.innerHTML = '<div class="gsw-end-card">' +
      '<div class="gsw-end-trophy">🏆</div>' +
      '<div class="gsw-end-title">' + (names.length > 1 ? names.join(" e ") + " vincono a pari merito!" : names[0] + " vince la partita!") + '</div>' +
      '<div class="gsw-end-sub">+1 punto gioco 🏆 · con ' + top + ' punti match</div>' +
      '<div class="gsw-end-list">' + order.map(function(i){
        var t = teams[i];
        return '<div class="gsw-end-row' + (winners.indexOf(i) >= 0 ? ' win' : '') + '">' +
          '<span><span class="gsw-dot" style="display:inline-block;margin-right:8px;background:' + esc(t.color || "#4dd9ff") + '"></span>' + esc(t.name) + '</span>' +
          '<span>' + (t.score || 0) + ' pt · 🏆 ' + (t.gamePoints || 0) + '</span></div>';
      }).join("") + '</div>' +
      '<div class="gsw-end-actions">' +
        '<a href="menu.html">← Torna al Menu</a>' +
        '<button type="button" id="gswEndStay">Resta qui</button>' +
      '</div></div>';
    ov.classList.add("show");
  }
  /* nel menu (fuori dai giochi) i punti match ripartono da zero */
  function resetMatchIfHub(){
    var el = document.getElementById("globalScoreWidget");
    if (!el || !el.hasAttribute("data-gsw-hub")) return;
    var data = load();
    if (!data) return;
    var changed = false;
    data.teams.forEach(function(t){ if (t.score){ t.score = 0; changed = true; } });
    if (changed) save(data);
  }
  resetMatchIfHub();
  window.addEventListener("pageshow", function(e){ if (e.persisted){ resetMatchIfHub(); window.renderGlobalScoreWidget(); } });
  window.addEventListener("storage", function(e){ if (e.key === KEY) window.renderGlobalScoreWidget(); });
  window.renderGlobalScoreWidget();
})();
</script>
