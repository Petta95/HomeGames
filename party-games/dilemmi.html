<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilemmi Morali — Party Games Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body class="theme-red">

<div class="bg-blobs"><span></span><span></span></div>

<nav class="navbar">
  <a class="nav-back" href="menu.html">← Menu</a>
  <span class="nav-title"><span class="dot"></span>⚖️ Dilemmi Morali</span>
  <span class="nav-counter" id="counter">Dilemma 1/80</span>
</nav>

<main class="stage">
  <div class="question-card">
    <div class="question-eyebrow">Dilemma morale</div>
    <p class="question-text" id="questionText">Caricamento...</p>
  </div>

  <div class="dilemma-grid">
    <div class="dilemma-option" id="optionA">A</div>
    <div class="dilemma-vs">VS</div>
    <div class="dilemma-option" id="optionB">B</div>
  </div>

  <div class="info-box">
    💬 Nessuna risposta giusta o sbagliata: ognuno espone la propria scelta e la motiva al gruppo. Vince chi convince di più!
  </div>

  <div id="timerSection" style="display:flex; flex-direction:column; align-items:center; gap:10px; width:100%;">
    <div class="timer-bar-track"><div class="timer-bar-fill" id="timerFill"></div></div>
    <span id="timerText" style="font-weight:600; color: var(--text-muted);">Pronti per la discussione</span>
  </div>

  <div class="actions-row">
    <button class="btn btn-outline" id="discussBtn">🗣 INIZIA DISCUSSIONE (20s)</button>
    <button class="btn btn-primary" id="nextBtn">PROSSIMO DILEMMA ▶</button>
  </div>
</main>

<script>
  /* =========================================================

     Aggiungi nuovi oggetti qui per espandere il gioco.
     ========================================================= */

    { q: "Sacrificheresti un'ora della tua vita ogni giorno per garantire la pace nel mondo?", a: "Sacrifico un'ora al giorno", b: "Tengo il mio tempo" },

    { q: "Vivresti un anno intero senza internet o per sempre senza il tuo cibo preferito?", a: "Niente internet per un anno", b: "Niente cibo preferito per sempre" },
    { q: "Accetteresti fama e ricchezza per 5 anni, sapendo che dopo perderai tutto?", a: "Accetto 5 anni da star", b: "Vita stabile e anonima" },
    { q: "Perdoneresti un tradimento se la persona ti amasse davvero e chiedesse una seconda possibilità?", a: "Perdono e ricomincio", b: "Chiudo per sempre" },

    { q: "Rinunceresti al tuo lavoro per seguire il partner in un altro paese?", a: "Rinuncio al lavoro", b: "Resto per la carriera" },
    { q: "Diresti a un collega che il suo capo parla male di lui alle spalle?", a: "Glielo dico", b: "Sto zitto" },
    { q: "Preferiresti essere ricco e infelice o povero e felice?", a: "Ricco e infelice", b: "Povero e felice" },

    { q: "Riveleresti ai tuoi amici di aver vinto alla lotteria, sapendo che cambierebbe tutto tra voi?", a: "Lo rivelo subito", b: "Lo tengo segreto" },
    { q: "Accetteresti un lavoro pagato benissimo ma che detesti, o uno modesto che ami?", a: "Ben pagato ma odiato", b: "Modesto ma amato" },
    { q: "Diresti a un amico la verità su un tradimento del partner, anche se rischia di distruggere la sua famiglia?", a: "Glielo dico", b: "Sto zitto" },
    { q: "Vivresti senza mai più poter dire una bugia, nemmeno bianca, per il resto della vita?", a: "Accetto, sempre sincero", b: "Rifiuto, mi servono le bugie bianche" },
    { q: "Sacrificheresti le tue vacanze annuali per aiutare economicamente un amico in difficoltà?", a: "Rinuncio alle vacanze", b: "Tengo le mie vacanze" },
    { q: "Accetteresti di non invecchiare mai fisicamente, vedendo però invecchiare tutti gli altri?", a: "Accetto l'eterna giovinezza", b: "Preferisco invecchiare con gli altri" },
    { q: "Diresti a un amico che la sua nuova idea imprenditoriale è destinata a fallire?", a: "Glielo dico", b: "Lo lascio provare in silenzio" },

    { q: "Cancelleresti per sempre il tuo più grande rimpianto, sapendo che cambierebbe chi sei oggi?", a: "Lo cancello", b: "Lo tengo, fa parte di me" },
    { q: "Rinunceresti a una promozione sapendo che andrebbe a un collega che ne ha più bisogno ma la merita meno?", a: "Rinuncio alla promozione", b: "La prendo comunque" },
    { q: "Sveleresti un segreto di famiglia per proteggere una persona che ami?", a: "Lo svelo", b: "Lo tengo nascosto" },
    { q: "Vivresti in un mondo dove tutti dicono sempre quello che pensano davvero di te?", a: "Sì, voglio la verità sempre", b: "No, preferisco l'ipocrisia gentile" },
    { q: "Rinunceresti allo smartphone per un anno intero in cambio di 50.000 euro?", a: "Rinuncio allo smartphone", b: "Tengo il telefono" },
    { q: "Diresti a un amico che il suo comportamento sta allontanando tutti, rischiando l'amicizia?", a: "Glielo dico", b: "Sto zitto per non litigare" },
    { q: "Vorresti sapere in anticipo ogni brutta notizia della tua vita, per essere sempre preparato?", a: "Voglio saperlo prima", b: "Preferisco essere sorpreso" },
    { q: "Lasceresti che un tuo errore venga attribuito a un collega innocente per salvare il tuo lavoro?", a: "Lo lascio credere", b: "Confesso l'errore" },
    { q: "Cancelleresti per sempre tutte le tue foto e video digitali in cambio di 10.000 euro?", a: "Cancello tutto", b: "Tengo i miei ricordi" },
    { q: "Diresti a un amico che il suo partner non ti piace, se te lo chiedesse sinceramente?", a: "Dico la verità", b: "Evito e resto vago" },
    { q: "Rinunceresti al sogno di una vita per garantire la felicità di una persona che ami?", a: "Rinuncio al mio sogno", b: "Realizzo il mio sogno" },
    { q: "Accetteresti di essere sempre in perfetta salute, ma perdendo per sempre il senso del gusto?", a: "Accetto il patto", b: "Rifiuto, il gusto vale troppo" },
    { q: "Confesseresti un tuo grave errore sul lavoro, anche rischiando il licenziamento?", a: "Confesso subito", b: "Nascondo l'errore" },
    { q: "Vivresti isolato dal mondo per 10 anni per garantire 10 milioni di euro alla tua famiglia?", a: "Accetto l'isolamento", b: "Rifiuto l'offerta" },
    { q: "Dimenticheresti per sempre una persona che ti ha fatto soffrire, insieme a tutti i bei ricordi con lei?", a: "Dimentico tutto", b: "Tengo anche i bei ricordi" },
    { q: "Preferiresti perdere tutti i tuoi ricordi d'infanzia o non poterne creare di nuovi per il resto della vita?", a: "Perdo i ricordi d'infanzia", b: "Non ne creo di nuovi" },
    { q: "Accetteresti di vivere senza mai più ridere in cambio di non piangere mai più?", a: "Niente risate", b: "Niente lacrime" },
    { q: "Rinunceresti al tuo miglior amico o al tuo partner, sapendo che non potrebbero mai andare d'accordo?", a: "Rinuncio all'amico", b: "Rinuncio al partner" },
    { q: "Preferiresti sapere sempre quando le persone ti mentono o non essere mai in grado di mentire tu stesso?", a: "Riconosco le bugie altrui", b: "Non posso mentire io" },
    { q: "Accetteresti di diventare famoso per un errore imbarazzante in cambio di un milione di euro?", a: "Accetto la fama imbarazzante", b: "Rifiuto, resto anonimo" },
    { q: "Vivresti senza gusto ma con l'olfatto intatto, o senza olfatto ma con il gusto intatto?", a: "Niente gusto", b: "Niente olfatto" },
    { q: "Diresti a un amico che il suo nuovo taglio di capelli è orribile se te lo chiedesse direttamente?", a: "Dico la verità", b: "Mento per non ferirlo" },
    { q: "Accetteresti di lavorare il doppio delle ore per guadagnare il doppio, o lavoreresti la metà guadagnando la metà?", a: "Doppio lavoro, doppia paga", b: "Metà lavoro, metà paga" },
    { q: "Rinunceresti alla tecnologia moderna per vivere 100 anni fa, o resteresti nel presente?", a: "Vivo nel passato", b: "Resto nel presente" },
    { q: "Accetteresti di conoscere la data di morte di tutti tranne la tua?", a: "Voglio saperlo", b: "Preferisco non saperlo" },
    { q: "Diresti a un collega che sta per essere licenziato se lo scoprissi prima di lui?", a: "Glielo dico", b: "Sto zitto" },
    { q: "Preferiresti vivere in una casa enorme isolata o in un piccolo appartamento in centro città?", a: "Casa grande isolata", b: "Appartamento in città" },
    { q: "Accetteresti di non poter mai più ascoltare musica in cambio di 200.000 euro?", a: "Accetto, niente musica", b: "Rifiuto, la musica vale di più" },
    { q: "Diresti a tua sorella o tuo fratello che il suo/la sua fidanzato/a ha provato a flirtare con te?", a: "Glielo dico subito", b: "Non dico nulla" },
    { q: "Preferiresti perdere la capacità di provare rabbia o quella di provare tristezza?", a: "Niente rabbia", b: "Niente tristezza" },
    { q: "Accetteresti di rinunciare al tuo cognome di famiglia per ereditare 5 milioni di euro?", a: "Cambio cognome", b: "Rifiuto l'eredità" },
    { q: "Diresti a un amico che il suo talento in qualcosa che ama è mediocre, se ti chiedesse un parere sincero?", a: "Dico la verità", b: "Lo incoraggio comunque" },
    { q: "Vivresti per sempre con la stessa età fisica che hai ora, rinunciando a vedere crescere eventuali figli?", a: "Resto per sempre così", b: "Invecchio normalmente" },
    { q: "Accetteresti di essere pagato per non lavorare mai più, ma senza poter mai più viaggiare?", a: "Accetto, niente lavoro", b: "Rifiuto, voglio viaggiare" },
    { q: "Diresti la verità su un regalo che non ti piace, se chi te l'ha fatto te lo chiedesse?", a: "Dico la verità", b: "Fingo di adorarlo" },
    { q: "Preferiresti avere sempre ragione ma perdere tutti gli amici, o avere spesso torto ma restare circondato di amici?", a: "Sempre ragione, da solo", b: "Spesso torto, con amici" },
    { q: "Accetteresti un lavoro all'estero pagato il triplo, sapendo che vedresti la tua famiglia una volta l'anno?", a: "Accetto il lavoro", b: "Resto vicino alla famiglia" },
    { q: "Diresti a un amico di smettere di uscire con una persona che secondo te non gli conviene?", a: "Glielo dico", b: "Lo lascio scegliere da solo" },
    { q: "Preferiresti vivere senza mai ammalarti ma senza mai innamorarti, o il contrario?", a: "Mai malato, mai innamorato", b: "Ti ammali ma puoi amare" },
    { q: "Accetteresti di cancellare il tuo profilo social per sempre in cambio di un anno di stipendio extra?", a: "Cancello i social", b: "Tengo i social" },
    { q: "Diresti a un amico che il partner con cui sta per sposarsi ti sembra sbagliato per lui?", a: "Glielo dico prima delle nozze", b: "Resto in silenzio" },
    { q: "Preferiresti essere il più intelligente ma il più brutto del gruppo, o il più bello ma il meno intelligente?", a: "Il più intelligente", b: "Il più bello" },
    { q: "Accetteresti di non poter più mangiare il tuo piatto preferito in cambio di non ingrassare mai più?", a: "Rinuncio al piatto preferito", b: "Rischio di ingrassare" },
    { q: "Diresti a un amico che il suo umorismo spesso offende le persone, anche se lui non se ne accorge?", a: "Glielo dico", b: "Lascio perdere" },
    { q: "Preferiresti vivere 200 anni in un mondo che cambia continuamente, o 80 anni in un mondo stabile e familiare?", a: "200 anni di cambiamento", b: "80 anni di stabilità" }
  ];

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let order = shuffle([...DILEMMAS]);
  let index = 0;
  let discussTimer = null;

  const questionText = document.getElementById("questionText");
  const optionA = document.getElementById("optionA");
  const optionB = document.getElementById("optionB");
  const counter = document.getElementById("counter");
  const nextBtn = document.getElementById("nextBtn");
  const discussBtn = document.getElementById("discussBtn");
  const timerFill = document.getElementById("timerFill");
  const timerText = document.getElementById("timerText");

  function resetTimerBar(){
    if (discussTimer) clearInterval(discussTimer);
    timerFill.style.transition = "none";
    timerFill.style.width = "100%";
    timerText.textContent = "Pronti per la discussione";
    discussBtn.disabled = false;
    // Forza il reflow per riabilitare la transizione al prossimo avvio
    void timerFill.offsetWidth;
    timerFill.style.transition = "width 1s linear";
  }

  function showDilemma(){
    const d = order[index];
    questionText.textContent = d.q;
    optionA.textContent = "A) " + d.a;
    optionB.textContent = "B) " + d.b;
    counter.textContent = `Dilemma ${index + 1}/${order.length}`;
    resetTimerBar();
  }

  nextBtn.addEventListener("click", () => {
    index++;
    if (index >= order.length){
      order = shuffle([...DILEMMAS]);
      index = 0;
    }
    showDilemma();
  });

  discussBtn.addEventListener("click", () => {
    discussBtn.disabled = true;
    let secondsLeft = 20;
    timerText.textContent = `Discussione in corso... ${secondsLeft}s`;
    timerFill.style.width = "0%";

    discussTimer = setInterval(() => {
      secondsLeft--;
      if (secondsLeft > 0){
        timerText.textContent = `Discussione in corso... ${secondsLeft}s`;
      } else {
        clearInterval(discussTimer);
        timerText.textContent = "⏰ Tempo scaduto! Rivelate la scelta.";
        discussBtn.disabled = false;
      }
    }, 1000);
  });

  showDilemma();
</script>

</body>
</html>
