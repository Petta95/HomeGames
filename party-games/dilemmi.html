<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilemmi Morali — Party Games Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Selettore tipo di dilemma */
  .pack-switch{
    display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 5px; margin: 0 auto 18px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 999px; backdrop-filter: blur(12px);
  }
  .pack-btn{
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 0.92rem;
    color: var(--text-muted); background: transparent; border: none;
    padding: 9px 18px; border-radius: 999px; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .pack-btn:hover{ color: #f2f4ff; }
  .pack-btn.active{ background: var(--accent); color: #06090f; box-shadow: 0 0 18px -4px var(--accent-glow); }

  /* Voti: ogni tocco su un'opzione aggiunge un voto */
  .vote-col{ display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .vote-col .dilemma-option{ width: 100%; flex: 1; }
  .vote-option{ cursor: pointer; user-select: none; transition: transform 0.12s ease; }
  .vote-option:active{ transform: scale(0.97); }
  .vote-count{ font-weight: 700; font-size: 0.95rem; color: var(--text-muted); }
  .vote-summary{ width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 8px; }
  .vote-bar{
    height: 10px; border-radius: 999px; overflow: hidden;
    background: linear-gradient(90deg, var(--accent) 0 var(--pa, 50%), #4dd9ff var(--pa, 50%) 100%);
    transition: background 0.3s ease;
  }
  .vote-bar.empty{ background: var(--glass-bg); border: 1px solid var(--glass-border); }
  .vote-summary-row{ display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--text-muted); font-weight: 600; font-size: 0.92rem; }
  .vote-reset{ background: none; border: none; color: var(--text-muted); font: inherit; cursor: pointer; text-decoration: underline; }
  .vote-reset:hover{ color: #f2f4ff; }
</style>
</head>
<body class="theme-red">

<div class="bg-blobs"><span></span><span></span></div>

<nav class="navbar">
  <a class="nav-back" href="menu.html">← Menu</a>
  <span class="nav-title"><span class="dot"></span>⚖️ Dilemmi Morali</span>
  <span class="nav-counter" id="counter">Dilemma 1/80</span>
</nav>

<main class="stage">
  <div class="pack-switch" role="group" aria-label="Tipo di dilemma">
    <button type="button" class="pack-btn active" data-pack="tutti">🎲 Tutti</button>
    <button type="button" class="pack-btn" data-pack="morali">⚖️ Morali</button>
    <button type="button" class="pack-btn" data-pack="preferiresti">🤪 Preferiresti</button>
    <button type="button" class="pack-btn" data-pack="soldi">💰 Lo faresti per…</button>
  </div>

  <div class="question-card">
    <div class="question-eyebrow">Dilemma morale</div>
    <p class="question-text" id="questionText">Caricamento...</p>
  </div>

  <div class="dilemma-grid">
    <div class="vote-col">
      <div class="dilemma-option vote-option" id="optionA" role="button" tabindex="0">A</div>
      <span class="vote-count" id="voteA">0 voti</span>
    </div>
    <div class="dilemma-vs">VS</div>
    <div class="vote-col">
      <div class="dilemma-option vote-option" id="optionB" role="button" tabindex="0">B</div>
      <span class="vote-count" id="voteB">0 voti</span>
    </div>
  </div>

  <div class="vote-summary">
    <div class="vote-bar empty" id="voteBar"></div>
    <div class="vote-summary-row">
      <span id="voteResult">Tocca A o B per votare</span>
      <button type="button" class="vote-reset" id="resetVotesBtn">↺ azzera voti</button>
    </div>
  </div>

  <div class="info-box">
    💬 Nessuna risposta giusta o sbagliata: ognuno espone la propria scelta e la motiva al gruppo. Vince chi convince di più!
  </div>

  <div id="timerSection" style="display:flex; flex-direction:column; align-items:center; gap:10px; width:100%;">
    <div class="timer-bar-track"><div class="timer-bar-fill" id="timerFill"></div></div>
    <span id="timerText" style="font-weight:600; color: var(--text-muted);">Pronti per la discussione</span>
  </div>

  <div class="actions-row">
    <button class="btn btn-outline" id="discussBtn">🗣 INIZIA DISCUSSIONE (20s)</button>
    <button class="btn btn-primary" id="nextBtn">PROSSIMO DILEMMA ▶</button>
  </div>
</main>

    { q: "Per 100.000 euro, ti trasferiresti per sempre in un paese di cui non conosci la lingua?", a: "Parto", b: "Resto qui" },

  /* =========================================================
     "PREFERIRESTI…" — scelte assurde e leggere.
     ========================================================= */
  const PREFERISCI = [

    { q: "Preferiresti ridere ogni volta che qualcuno piange o piangere ogni volta che qualcuno ride?", a: "Rido quando piangono", b: "Piango quando ridono" },
    { q: "Preferiresti indossare per sempre il costume di carnevale o il pigiama?", a: "Costume di carnevale", b: "Pigiama" },

    { q: "Preferiresti che ogni tua foto venisse con gli occhi chiusi o mossa?", a: "Occhi chiusi", b: "Sempre mossa" }
  ];

  // Pacchetti: i dilemmi "Per ... euro" formano la sezione Soldi
  const isMoney = d => /^Per [\d.]+( milione di)? euro/.test(d.q);
  const PACKS = {
    tutti: () => [...DILEMMAS, ...PREFERISCI],
    morali: () => DILEMMAS.filter(d => !isMoney(d)),
    preferiresti: () => PREFERISCI,
    soldi: () => DILEMMAS.filter(isMoney)
  };
  let pack = "tutti";

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let order = shuffle(PACKS[pack]());
  let index = 0;
  let discussTimer = null;

  const questionText = document.getElementById("questionText");
  const optionA = document.getElementById("optionA");
  const optionB = document.getElementById("optionB");
  const counter = document.getElementById("counter");
  const nextBtn = document.getElementById("nextBtn");
  const discussBtn = document.getElementById("discussBtn");
  const timerFill = document.getElementById("timerFill");
  const timerText = document.getElementById("timerText");

  function resetTimerBar(){
    if (discussTimer) clearInterval(discussTimer);
    timerFill.style.transition = "none";
    timerFill.style.width = "100%";
    timerText.textContent = "Pronti per la discussione";
    discussBtn.disabled = false;
    // Forza il reflow per riabilitare la transizione al prossimo avvio
    void timerFill.offsetWidth;
    timerFill.style.transition = "width 1s linear";
  }

  function showDilemma(){
    const d = order[index];
    questionText.textContent = d.q;
    optionA.textContent = "A) " + d.a;
    optionB.textContent = "B) " + d.b;
    resetVotes();
    counter.textContent = `Dilemma ${index + 1}/${order.length}`;
    resetTimerBar();
  }

  nextBtn.addEventListener("click", () => {
    index++;
    if (index >= order.length){
      order = shuffle(PACKS[pack]());
      index = 0;
    }
    showDilemma();
  });

  discussBtn.addEventListener("click", () => {
    discussBtn.disabled = true;
    let secondsLeft = 20;
    timerText.textContent = `Discussione in corso... ${secondsLeft}s`;
    timerFill.style.width = "0%";

    discussTimer = setInterval(() => {
      secondsLeft--;
      if (secondsLeft > 0){
        timerText.textContent = `Discussione in corso... ${secondsLeft}s`;
      } else {
        clearInterval(discussTimer);
        timerText.textContent = "⏰ Tempo scaduto! Rivelate la scelta.";
        discussBtn.disabled = false;
      }
    }, 1000);
  });

  /* ---- Selettore pacchetto ---- */
  const packButtons = document.querySelectorAll(".pack-btn");
  packButtons.forEach(btn => btn.addEventListener("click", () => {
    pack = btn.dataset.pack;
    packButtons.forEach(b => b.classList.toggle("active", b === btn));
    order = shuffle(PACKS[pack]());
    index = 0;
    showDilemma();
  }));

  /* ---- Conteggio voti: tocca un'opzione per aggiungere un voto ---- */
  const votes = { a: 0, b: 0 };
  const voteA = document.getElementById("voteA");
  const voteB = document.getElementById("voteB");
  const voteBar = document.getElementById("voteBar");
  function renderVotes(){
    const tot = votes.a + votes.b;
    voteA.textContent = votes.a + (votes.a === 1 ? " voto" : " voti");
    voteB.textContent = votes.b + (votes.b === 1 ? " voto" : " voti");
    voteBar.style.setProperty("--pa", tot ? (votes.a / tot * 100) + "%" : "50%");
    voteBar.classList.toggle("empty", !tot);
    document.getElementById("voteResult").textContent = tot
      ? `A ${Math.round(votes.a / tot * 100)}% · B ${Math.round(votes.b / tot * 100)}%`
      : "Tocca A o B per votare";
  }
  function resetVotes(){ votes.a = 0; votes.b = 0; renderVotes(); }
  optionA.addEventListener("click", () => { votes.a++; renderVotes(); });
  optionB.addEventListener("click", () => { votes.b++; renderVotes(); });
  document.getElementById("resetVotesBtn").addEventListener("click", resetVotes);

  showDilemma();
</script>


<!-- ============================================================
     WIDGET PUNTEGGIO GLOBALE — visibile in ogni gioco, legge/scrive
     la stessa chiave localStorage impostata in index.html. Non
     dipende dalle variabili interne del gioco che lo ospita.
     ============================================================ -->
<div id="globalScoreWidget" class="global-score-widget"></div>
<style>
  .global-score-widget{
    position: fixed; bottom: 14px; right: 14px; z-index: 99999;
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    font-family: 'Inter', sans-serif; pointer-events: none;
  }
  .global-score-widget > *{ pointer-events: auto; }
  .gsw-team{
    display: flex; align-items: center; gap: 6px;
    background: rgba(8,10,20,0.88); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; padding: 5px 8px 5px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px -4px rgba(0,0,0,0.5);
    font-size: 0.76rem; color: #fff; white-space: nowrap;
  }
  .gsw-dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .gsw-name{ font-weight: 700; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .gsw-score{ font-weight: 900; font-family: 'Poppins', sans-serif; min-width: 18px; text-align: center; }
  .gsw-btn{
    width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; font-size: 0.72rem;
    display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0;
    transition: background 0.15s ease;
  }
  .gsw-btn:hover{ background: rgba(255,255,255,0.32); }
  .gsw-reset{
    font-size: 0.65rem; color: rgba(255,255,255,0.55);
    background: rgba(8,10,20,0.7); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; cursor: pointer; padding: 3px 10px;
  }
  .gsw-reset:hover{ color: #fff; border-color: rgba(255,255,255,0.3); }
  @media (max-width: 560px){
    .global-score-widget{ bottom: 8px; right: 8px; }
    .gsw-name{ max-width: 72px; }
  }
</style>
<script>
(function(){
  var KEY = "homeGamesTeams";
  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw){
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.teams) && d.teams.length >= 2) return d;
      }
    } catch(e) {}
    return null;
  }
  function save(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  function esc(s){
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }
  window.renderGlobalScoreWidget = function(){
    var el = document.getElementById("globalScoreWidget");
    if (!el) return;
    var data = load();
    if (!data){ el.innerHTML = ""; return; }
    var n = data.count || data.teams.length;
    var html = data.teams.slice(0, n).map(function(t, i){
      return '<div class="gsw-team">' +
        '<span class="gsw-dot" style="background:' + esc(t.color || "#4dd9ff") + '"></span>' +
        '<span class="gsw-name">' + esc(t.name) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="-1" aria-label="Togli un punto">−</button>' +
        '<span class="gsw-score">' + (t.score || 0) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="1" aria-label="Aggiungi un punto">+</button>' +
      '</div>';
    }).join("");
    html += '<button type="button" class="gsw-reset" id="gswResetBtn">azzera punteggi</button>';
    el.innerHTML = html;
  };
  document.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest(".gsw-btn") : null;
    if (btn){
      var data = load();
      if (!data) return;
      var i = Number(btn.getAttribute("data-gsw-i"));
      var d = Number(btn.getAttribute("data-gsw-d"));
      if (!data.teams[i]) return;
      data.teams[i].score = Math.max(0, (data.teams[i].score || 0) + d);
      save(data);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
      return;
    }
    if (e.target && e.target.id === "gswResetBtn"){
      var data2 = load();
      if (!data2) return;
      if (!confirm("Azzerare il punteggio di tutte le squadre?")) return;
      data2.teams.forEach(function(t){ t.score = 0; });
      save(data2);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
    }
  });
  window.renderGlobalScoreWidget();
})();
</script>
