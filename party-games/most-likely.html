<!DOCTYPE html>

<style>
  /* Selettore pacchetto domande: Classiche / Spicy +18 */
  .pack-switch{
    display: inline-flex; gap: 6px; padding: 5px; margin: 0 auto 18px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 999px; backdrop-filter: blur(12px);
  }
  .pack-btn{
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 0.95rem;
    color: var(--text-muted); background: transparent; border: none;
    padding: 9px 20px; border-radius: 999px; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .pack-btn:hover{ color: #f2f4ff; }
  .pack-btn.active{ background: var(--accent); color: #06090f; box-shadow: 0 0 18px -4px var(--accent-glow); }

<body class="theme-orange">

<div class="bg-blobs"><span></span><span></span></div>

<nav class="navbar">
  <a class="nav-back" href="menu.html">← Menu</a>
  <span class="nav-title"><span class="dot"></span>🍻 Il Più Probabile</span>
  <span class="nav-counter" id="counter">Domanda 1/80</span>
</nav>

<main class="stage">
  <div class="pack-switch" role="group" aria-label="Pacchetto domande">
    <button type="button" class="pack-btn active" data-pack="classic">🍻 Classiche</button>
    <button type="button" class="pack-btn" data-pack="spicy">🌶️ Spicy +18</button>
  </div>

  <div class="question-card">
    <div class="question-eyebrow" id="questionEyebrow">Chi è più propenso a...</div>
    <p class="question-text" id="questionText">Caricamento...</p>
  </div>

  <div class="info-box">
    🍻 <strong>Penitenza:</strong> chi riceve più voti beve tanti sorsi quanti sono i voti ricevuti!
  </div>

  <div class="actions-row">
    <button class="btn btn-outline" id="voteBtn">⏱ MOSTRA TIMER / VOTA</button>
    <button class="btn btn-primary" id="nextBtn">PROSSIMA DOMANDA ▶</button>
  </div>
</main>

<!-- Overlay countdown per il voto -->
<div class="timer-overlay" id="timerOverlay">
  <div class="timer-number" id="timerNumber">3</div>
  <div class="timer-label" id="timerLabel">Preparatevi a indicare...</div>
</div>

<script>

  /* =========================================================

     ========================================================= */
  const SPICY_QUESTIONS = [

    "Chi ha mandato più messaggi piccanti di cui si è pentito?",

    "Chi proverebbe una serata in un locale per scambisti per curiosità?",
    "Chi ha lasciato qualcuno con un semplice messaggio (o sparendo nel nulla)?",
    "Chi ha fatto ghosting dopo il primo appuntamento finito a letto?",
    "Chi è stato/a con qualcuno molto più grande o molto più giovane?",
    "Chi ha fatto la cosa più piccante in macchina?",
    "Chi si innamora di chiunque gli/le faccia un complimento?",
    "Chi ha usato una scusa assurda per non restare a dormire da qualcuno?",
    "Chi si metterebbe con due persone contemporaneamente?",
    "Chi è il/la più esperto/a di giochi di ruolo in camera da letto?",
    "Chi ha mandato un vocale piccante alla persona sbagliata?",
    "Chi ha avuto un'avventura in vacanza che non ha mai raccontato a nessuno?",
    "Chi ha tenuto una relazione nascosta agli amici per mesi?",
    "Chi si è fatto/a beccare da un vicino di casa?",
    "Chi ha più ex che gli scrivono ancora?",
    "Chi ha fatto la proposta più sfacciata a un primo appuntamento?",
    "Chi girerebbe nudo/a per casa anche con ospiti?",
    "Chi ha una lista di cose piccanti ancora da provare?",
    "Chi ha avuto una storia con un/una collega?",
    "Chi finirebbe su un'app di incontri il giorno dopo una rottura?",
    "Chi reggerebbe meno una settimana di astinenza?"

  /** Mescola l'array in place (Fisher-Yates) */
  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let spicy = false;           // sezione attiva: false = classiche, true = Spicy / +18
  let spicyConfirmed = false;  // conferma +18 chiesta una sola volta per sessione
  const activeDeck = () => spicy ? SPICY_QUESTIONS : QUESTIONS;

  let order = shuffle([...activeDeck()]);
  let index = 0;

  const questionText = document.getElementById("questionText");
  const questionEyebrow = document.getElementById("questionEyebrow");
  const counter = document.getElementById("counter");
  const nextBtn = document.getElementById("nextBtn");
  const voteBtn = document.getElementById("voteBtn");
  const packButtons = document.querySelectorAll(".pack-btn");

  /* ---- Selettore pacchetto: Classiche / Spicy +18 ---- */
  function setPack(wantSpicy){
    if (wantSpicy === spicy) return;
    if (wantSpicy && !spicyConfirmed){
      if (!confirm("🌶️ Pacchetto Spicy / +18\n\nDomande piccanti per adulti: giocatelo solo se tutti i presenti sono maggiorenni e d'accordo. Continuare?")) return;
      spicyConfirmed = true;
    }
    spicy = wantSpicy;
    document.body.classList.toggle("theme-orange", !spicy);
    document.body.classList.toggle("theme-red", spicy);
    packButtons.forEach(b => b.classList.toggle("active", (b.dataset.pack === "spicy") === spicy));
    questionEyebrow.textContent = spicy ? "🌶️ Spicy +18 — Chi è più propenso a..." : "Chi è più propenso a...";
    order = shuffle([...activeDeck()]);
    index = 0;
    showQuestion();
  }
  packButtons.forEach(b => b.addEventListener("click", () => setPack(b.dataset.pack === "spicy")));

  function showQuestion(){
    questionText.textContent = order[index];
    counter.textContent = `Domanda ${index + 1}/${order.length}`;
  }

  nextBtn.addEventListener("click", () => {
    index++;
    if (index >= order.length){
      // Fine del mazzo: rimescola e ricomincia
      order = shuffle([...activeDeck()]);
      index = 0;
    }
    showQuestion();
  });

  /* =========================================================
     TIMER DI VOTO: countdown 3-2-1 con beep, poi "INDICA!"
     ========================================================= */
  const overlay = document.getElementById("timerOverlay");
  const timerNumber = document.getElementById("timerNumber");
  const timerLabel = document.getElementById("timerLabel");

  // Beep generato via Web Audio API: nessun file audio esterno necessario
  function beep(freq, duration){
    try{
      const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e){ /* Web Audio non disponibile: si prosegue senza audio */ }
  }

  voteBtn.addEventListener("click", () => {
    voteBtn.disabled = true;
    let count = 3;
    overlay.classList.add("active");
    timerNumber.textContent = count;
    timerLabel.textContent = "Preparatevi a indicare...";
    beep(440, 0.15);

    const interval = setInterval(() => {
      count--;
      if (count > 0){
        timerNumber.textContent = count;
        beep(440, 0.15);
      } else {
        timerNumber.textContent = "👉";
        timerLabel.textContent = "INDICA!";
        beep(880, 0.35);
        clearInterval(interval);
        setTimeout(() => {
          overlay.classList.remove("active");
          voteBtn.disabled = false;
        }, 1400);
      }
    }, 1000);
  });

  showQuestion();
</script>


<!-- ============================================================
     WIDGET PUNTEGGIO GLOBALE — visibile in ogni gioco, legge/scrive
     la stessa chiave localStorage impostata in index.html. Non
     dipende dalle variabili interne del gioco che lo ospita.
     ============================================================ -->
<div id="globalScoreWidget" class="global-score-widget"></div>
<style>
  .global-score-widget{
    position: fixed; bottom: 14px; right: 14px; z-index: 99999;
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    font-family: 'Inter', sans-serif; pointer-events: none;
  }
  .global-score-widget > *{ pointer-events: auto; }
  .gsw-team{
    display: flex; align-items: center; gap: 6px;
    background: rgba(8,10,20,0.88); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; padding: 5px 8px 5px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px -4px rgba(0,0,0,0.5);
    font-size: 0.76rem; color: #fff; white-space: nowrap;
  }
  .gsw-dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .gsw-name{ font-weight: 700; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .gsw-score{ font-weight: 900; font-family: 'Poppins', sans-serif; min-width: 18px; text-align: center; }
  .gsw-btn{
    width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; font-size: 0.72rem;
    display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0;
    transition: background 0.15s ease;
  }
  .gsw-btn:hover{ background: rgba(255,255,255,0.32); }
  .gsw-reset{
    font-size: 0.65rem; color: rgba(255,255,255,0.55);
    background: rgba(8,10,20,0.7); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; cursor: pointer; padding: 3px 10px;
  }
  .gsw-reset:hover{ color: #fff; border-color: rgba(255,255,255,0.3); }
  @media (max-width: 560px){
    .global-score-widget{ bottom: 8px; right: 8px; }
    .gsw-name{ max-width: 72px; }
  }
</style>
<script>
(function(){
  var KEY = "homeGamesTeams";
  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw){
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.teams) && d.teams.length >= 2) return d;
      }
    } catch(e) {}
    return null;
  }
  function save(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  function esc(s){
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }
  window.renderGlobalScoreWidget = function(){
    var el = document.getElementById("globalScoreWidget");
    if (!el) return;
    var data = load();
    if (!data){ el.innerHTML = ""; return; }
    var n = data.count || data.teams.length;
    var html = data.teams.slice(0, n).map(function(t, i){
      return '<div class="gsw-team">' +
        '<span class="gsw-dot" style="background:' + esc(t.color || "#4dd9ff") + '"></span>' +
        '<span class="gsw-name">' + esc(t.name) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="-1" aria-label="Togli un punto">−</button>' +
        '<span class="gsw-score">' + (t.score || 0) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="1" aria-label="Aggiungi un punto">+</button>' +
      '</div>';
    }).join("");
    html += '<button type="button" class="gsw-reset" id="gswResetBtn">azzera punteggi</button>';
    el.innerHTML = html;
  };
  document.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest(".gsw-btn") : null;
    if (btn){
      var data = load();
      if (!data) return;
      var i = Number(btn.getAttribute("data-gsw-i"));
      var d = Number(btn.getAttribute("data-gsw-d"));
      if (!data.teams[i]) return;
      data.teams[i].score = Math.max(0, (data.teams[i].score || 0) + d);
      save(data);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
      return;
    }
    if (e.target && e.target.id === "gswResetBtn"){
      var data2 = load();
      if (!data2) return;
      if (!confirm("Azzerare il punteggio di tutte le squadre?")) return;
      data2.teams.forEach(function(t){ t.score = 0; });
      save(data2);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
    }
  });
  window.renderGlobalScoreWidget();
})();
</script>
