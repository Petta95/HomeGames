<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Più Probabile — Party Games Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body class="theme-orange">

<div class="bg-blobs"><span></span><span></span></div>

<nav class="navbar">
  <a class="nav-back" href="menu.html">← Menu</a>
  <span class="nav-title"><span class="dot"></span>🍻 Il Più Probabile</span>
  <span class="nav-counter" id="counter">Domanda 1/80</span>
</nav>

<main class="stage">
  <div class="question-card">
    <div class="question-eyebrow">Chi è più propenso a...</div>
    <p class="question-text" id="questionText">Caricamento...</p>
  </div>

  <div class="info-box">
    🍻 <strong>Penitenza:</strong> chi riceve più voti beve tanti sorsi quanti sono i voti ricevuti!
  </div>

  <div class="actions-row">
    <button class="btn btn-outline" id="voteBtn">⏱ MOSTRA TIMER / VOTA</button>
    <button class="btn btn-primary" id="nextBtn">PROSSIMA DOMANDA ▶</button>
  </div>
</main>

<!-- Overlay countdown per il voto -->
<div class="timer-overlay" id="timerOverlay">
  <div class="timer-number" id="timerNumber">3</div>
  <div class="timer-label" id="timerLabel">Preparatevi a indicare...</div>
</div>

<script>
  /* =========================================================
     DATABASE DOMANDE — aggiungi nuove voci a questo array
     per espandere il gioco, non serve toccare altro codice.
     ========================================================= */
  const QUESTIONS = [
    "Chi è il più alcolizzato?",
    "Chi vincerebbe in una gara a chi mangia di più?",
    "Chi è il tipo da farsi un tatuaggio di cui si pentirà?",
    "Chi è il più tirchio?",
    "Chi farebbe il bagno nudo da sbronzo?",
    "Chi piangerebbe per un film?",
    "Chi direbbe ti amo troppo presto?",
    "Chi chiamerei se avessi bisogno di aiuto per qualcosa di illegale?",
    "Chi avrebbe il funerale con il minor numero di partecipanti?",
    "Chi ha più probabilità di tradire?",
    "Se fossimo tutti stand-up comici, chi riceverebbe il minor numero di risate?",
    "Chi viene pagato troppo per ciò che fa?",
    "Se fossimo tutti autostoppisti, chi sarebbe l'ultima persona a farsi prendere?",
    "Chi tende a finire friendzonato?",
    "Chi incolperebbe il proprio segno zodiacale per il suo carattere di merda?",
    "Chi si presenterebbe ubriaco a un funerale?",
    "Chi sarebbe il peggior operatore per una hotline erotica?",
    "Per quelli che non fumano, chi potrebbe iniziare a fumare?",
    "Chi darebbe in adozione i propri figli se fossero brutti?",
    "Chi adotterebbe se non potesse avere figli?",
    "Chi non sa mantenere i segreti?",
    "Chi parla troppo quando beve?",
    "Chi sarebbe il primo a scappare in caso di apocalisse zombie?",
    "Chi finirebbe per sposarsi a Las Vegas per errore?",
    "Chi ruberebbe il WiFi del vicino senza pensarci due volte?",
    "Chi si perderebbe anche con il navigatore acceso?",
    "Chi diventerebbe famoso sui social per sbaglio?",
    "Chi finirebbe a un reality show in TV?",
    "Chi mangerebbe qualcosa caduto per terra senza pensarci?",
    "Chi si addormenterebbe durante un film al cinema?",
    "Chi spenderebbe tutto lo stipendio in un solo giorno?",
    "Chi organizzerebbe la festa più assurda della propria vita?",
    "Chi si farebbe convincere a fare bungee jumping senza esitare?",
    "Chi diventerebbe vegano per una settimana e poi mollerebbe tutto?",
    "Chi litigherebbe con uno sconosciuto per un parcheggio?",
    "Chi manderebbe un messaggio alla persona sbagliata per errore?",
    "Chi si offrirebbe volontario per un esperimento scientifico strano?",
    "Chi finirebbe per adottare troppi animali?",
    "Chi diventerebbe un influencer di fitness dal nulla?",
    "Chi si sposerebbe con la prima persona conosciuta su un'app di incontri?",
    "Chi perderebbe un volo per fare tardi al trucco o dal parrucchiere?",
    "Chi litigherebbe con un cartello stradale... da sobrio?",
    "Chi venderebbe la propria auto per andare a un concerto all'estero?",
    "Chi si farebbe un selfie anche durante un terremoto?",
    "Chi convincerebbe tutti a fare un viaggio last minute senza pensarci?",
    "Chi si dimenticherebbe il proprio compleanno?",
    "Chi finirebbe per innamorarsi di un collega di lavoro?",
    "Chi accetterebbe una sfida imbarazzante solo per soldi facili?",
    "Chi chiamerebbe l'ex a tarda notte dopo qualche bicchiere di troppo?",
    "Chi vincerebbe un premio per il peggior senso dell'orientamento?",
    "Chi si iscriverebbe in palestra e non ci andrebbe mai?",
    "Chi finirebbe per litigare con un cameriere per un piatto sbagliato?",
    "Chi comprerebbe un biglietto della lotteria ogni settimana sperando di vincere?",
    "Chi si farebbe convincere a saltare col paracadute all'ultimo momento?",
    "Chi manderebbe una foto imbarazzante al gruppo sbagliato?",
    "Chi si addormenterebbe a una festa prima di mezzanotte?",
    "Chi finirebbe per piangere guardando una pubblicità?",
    "Chi si perderebbe durante un'escursione anche con la mappa in mano?",
    "Chi organizzerebbe una cena e dimenticherebbe un ingrediente fondamentale?",
    "Chi finirebbe per litigare con Alexa o Siri?",
    "Chi si farebbe tatuare il nome del proprio animale domestico?",
    "Chi comprerebbe vestiti solo per postarli sui social e poi non li indosserebbe mai?",
    "Chi finirebbe per credere a una fake news senza controllare?",
    "Chi si dimenticherebbe dove ha parcheggiato l'auto?",
    "Chi accetterebbe una sfida stupida solo per farsi vedere coraggioso/a?",
    "Chi finirebbe per innamorarsi di un personaggio di una serie TV?",
    "Chi risponderebbe al telefono durante un film al cinema?",
    "Chi si farebbe convincere a fare karaoke da sobrio/a?",
    "Chi spenderebbe più soldi in una singola serata senza accorgersene?",
    "Chi finirebbe per litigare con il GPS per una strada sbagliata?",
    "Chi si presenterebbe in ritardo al proprio matrimonio?",
    "Chi manderebbe un vocale di 10 minuti senza motivo?",
    "Chi finirebbe per adottare un animale trovato per strada senza pensarci?",
    "Chi si offrirebbe di guidare e poi si perderebbe comunque?",
    "Chi comprerebbe l'ultimo modello di telefono solo per moda?",
    "Chi finirebbe per fare amicizia con uno sconosciuto in fila al supermercato?",
    "Chi si dimenticherebbe l'anniversario di una relazione?",
    "Chi accetterebbe di travestirsi in modo ridicolo per vincere una scommessa?",
    "Chi finirebbe per litigare per l'ultimo pezzo di pizza?",
    "Chi si iscriverebbe a un corso strano solo per curiosità e poi lo abbandonerebbe subito?"
  ];

  /** Mescola l'array in place (Fisher-Yates) */
  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let order = shuffle([...QUESTIONS]);
  let index = 0;

  const questionText = document.getElementById("questionText");
  const counter = document.getElementById("counter");
  const nextBtn = document.getElementById("nextBtn");
  const voteBtn = document.getElementById("voteBtn");

  function showQuestion(){
    questionText.textContent = order[index];
    counter.textContent = `Domanda ${index + 1}/${order.length}`;
  }

  nextBtn.addEventListener("click", () => {
    index++;
    if (index >= order.length){
      // Fine del mazzo: rimescola e ricomincia
      order = shuffle([...QUESTIONS]);
      index = 0;
    }
    showQuestion();
  });

  /* =========================================================
     TIMER DI VOTO: countdown 3-2-1 con beep, poi "INDICA!"
     ========================================================= */
  const overlay = document.getElementById("timerOverlay");
  const timerNumber = document.getElementById("timerNumber");
  const timerLabel = document.getElementById("timerLabel");

  // Beep generato via Web Audio API: nessun file audio esterno necessario
  function beep(freq, duration){
    try{
      const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e){ /* Web Audio non disponibile: si prosegue senza audio */ }
  }

  voteBtn.addEventListener("click", () => {
    voteBtn.disabled = true;
    let count = 3;
    overlay.classList.add("active");
    timerNumber.textContent = count;
    timerLabel.textContent = "Preparatevi a indicare...";
    beep(440, 0.15);

    const interval = setInterval(() => {
      count--;
      if (count > 0){
        timerNumber.textContent = count;
        beep(440, 0.15);
      } else {
        timerNumber.textContent = "👉";
        timerLabel.textContent = "INDICA!";
        beep(880, 0.35);
        clearInterval(interval);
        setTimeout(() => {
          overlay.classList.remove("active");
          voteBtn.disabled = false;
        }, 1400);
      }
    }, 1000);
  });

  showQuestion();
</script>


<!-- ============================================================
     WIDGET PUNTEGGIO GLOBALE — visibile in ogni gioco, legge/scrive
     la stessa chiave localStorage impostata in index.html. Non
     dipende dalle variabili interne del gioco che lo ospita.
     ============================================================ -->
<div id="globalScoreWidget" class="global-score-widget"></div>
<style>
  .global-score-widget{
    position: fixed; bottom: 14px; right: 14px; z-index: 99999;
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    font-family: 'Inter', sans-serif; pointer-events: none;
  }
  .global-score-widget > *{ pointer-events: auto; }
  .gsw-team{
    display: flex; align-items: center; gap: 6px;
    background: rgba(8,10,20,0.88); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px; padding: 5px 8px 5px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px -4px rgba(0,0,0,0.5);
    font-size: 0.76rem; color: #fff; white-space: nowrap;
  }
  .gsw-dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .gsw-name{ font-weight: 700; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .gsw-score{ font-weight: 900; font-family: 'Poppins', sans-serif; min-width: 18px; text-align: center; }
  .gsw-btn{
    width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; font-size: 0.72rem;
    display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0;
    transition: background 0.15s ease;
  }
  .gsw-btn:hover{ background: rgba(255,255,255,0.32); }
  .gsw-reset{
    font-size: 0.65rem; color: rgba(255,255,255,0.55);
    background: rgba(8,10,20,0.7); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; cursor: pointer; padding: 3px 10px;
  }
  .gsw-reset:hover{ color: #fff; border-color: rgba(255,255,255,0.3); }
  @media (max-width: 560px){
    .global-score-widget{ bottom: 8px; right: 8px; }
    .gsw-name{ max-width: 72px; }
  }
</style>
<script>
(function(){
  var KEY = "homeGamesTeams";
  function load(){
    try {
      var raw = localStorage.getItem(KEY);
      if (raw){
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.teams) && d.teams.length >= 2) return d;
      }
    } catch(e) {}
    return null;
  }
  function save(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  function esc(s){
    var div = document.createElement("div");
    div.textContent = s == null ? "" : s;
    return div.innerHTML;
  }
  window.renderGlobalScoreWidget = function(){
    var el = document.getElementById("globalScoreWidget");
    if (!el) return;
    var data = load();
    if (!data){ el.innerHTML = ""; return; }
    var n = data.count || data.teams.length;
    var html = data.teams.slice(0, n).map(function(t, i){
      return '<div class="gsw-team">' +
        '<span class="gsw-dot" style="background:' + esc(t.color || "#4dd9ff") + '"></span>' +
        '<span class="gsw-name">' + esc(t.name) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="-1" aria-label="Togli un punto">−</button>' +
        '<span class="gsw-score">' + (t.score || 0) + '</span>' +
        '<button type="button" class="gsw-btn" data-gsw-i="' + i + '" data-gsw-d="1" aria-label="Aggiungi un punto">+</button>' +
      '</div>';
    }).join("");
    html += '<button type="button" class="gsw-reset" id="gswResetBtn">azzera punteggi</button>';
    el.innerHTML = html;
  };
  document.addEventListener("click", function(e){
    var btn = e.target.closest ? e.target.closest(".gsw-btn") : null;
    if (btn){
      var data = load();
      if (!data) return;
      var i = Number(btn.getAttribute("data-gsw-i"));
      var d = Number(btn.getAttribute("data-gsw-d"));
      if (!data.teams[i]) return;
      data.teams[i].score = Math.max(0, (data.teams[i].score || 0) + d);
      save(data);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
      return;
    }
    if (e.target && e.target.id === "gswResetBtn"){
      var data2 = load();
      if (!data2) return;
      if (!confirm("Azzerare il punteggio di tutte le squadre?")) return;
      data2.teams.forEach(function(t){ t.score = 0; });
      save(data2);
      window.renderGlobalScoreWidget();
      window.dispatchEvent(new CustomEvent("globalScoreChanged"));
    }
  });
  window.renderGlobalScoreWidget();
})();
</script>

</body>
</html>
