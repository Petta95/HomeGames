<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PETTA & MARI — Le Nostre App</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🐒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     PETTA & MARI — raccolta delle app di coppia (viaggi,
     ristoranti, ...). Stesso stile grafico di HOME GAMES.
     ========================================================= */
  :root{
    --bg-deep: #0a0e1a;
    --text-main: #f2f4ff;
    --text-muted: #9aa3c0;
    --accent: #2dd4a7;
    --accent2: #ff6fa8;
    --glass-border: rgba(255, 255, 255, 0.10);
    --glass-bg: rgba(255, 255, 255, 0.045);
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    min-height: 100%;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* ---- Sfondo animato ---- */
  .bg-blobs{
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: radial-gradient(circle at 20% 20%, #131a33 0%, var(--bg-deep) 55%);
  }
  .bg-blobs span{
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.32;
    animation: float 22s ease-in-out infinite;
  }
  .bg-blobs span:nth-child(1){ width: 480px; height: 480px; background: var(--accent); top: -10%; left: -10%; }
  .bg-blobs span:nth-child(2){ width: 520px; height: 520px; background: var(--accent2); bottom: -15%; right: -10%; animation-delay: -6s; }
  @keyframes float{
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40px, -30px) scale(1.08); }
  }

  /* ---- Header ---- */
  .app-header{ text-align: center; padding: 56px 20px 28px; }
  .app-title{
    font-family: 'Poppins', sans-serif; font-weight: 900;
    font-size: clamp(2.4rem, 6vw, 4.4rem); letter-spacing: 2px;
    text-transform: uppercase; line-height: 1.05;
  }
  .app-title span{
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .app-subtitle{
    margin-top: 10px; font-size: clamp(1rem, 2vw, 1.25rem);
    color: var(--text-muted); font-weight: 500;
  }

  /* ---- Personaggi: Petta la scimmietta e Mari il pulcino ---- */
  .duo{
    display: flex; align-items: flex-end; justify-content: center; gap: 6px;
    margin-bottom: 14px;
  }
  .buddy{ display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .buddy svg{ width: clamp(84px, 20vw, 120px); height: auto; overflow: visible; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
  .buddy-name{
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: .85rem; letter-spacing: 1px;
    text-transform: uppercase; padding: 4px 12px; border-radius: 999px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
  }
  .buddy.petta .buddy-name{ color: #e7b58f; }
  .buddy.mari  .buddy-name{ color: #ffd84a; }
  .duo-heart{ font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 4px 52px; animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.2); } }
  .buddy .bob{ animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; transform-box: fill-box; }
  .buddy.mari .bob{ animation-delay: -1.6s; }
  .buddy .eyes{ animation: blink 5s infinite; transform-origin: center; transform-box: fill-box; }
  .buddy.mari .eyes{ animation-delay: -2.3s; }
  .buddy.hop .bob{ animation: hop .55s ease-in-out 2; }
  .buddy .wing-l{ transform-origin: 80% 20%; transform-box: fill-box; }
  .buddy .wing-r{ transform-origin: 20% 20%; transform-box: fill-box; }
  .buddy.mari.hop .wing-l{ animation: flapL .18s ease-in-out 6 alternate; }
  .buddy.mari.hop .wing-r{ animation: flapR .18s ease-in-out 6 alternate; }
  @keyframes bob{ 0%,100%{ transform: translateY(0) rotate(0); } 50%{ transform: translateY(-5px) rotate(-2deg); } }
  @keyframes hop{ 0%,100%{ transform: translateY(0); } 40%{ transform: translateY(-16px) rotate(5deg); } }
  @keyframes blink{ 0%,46%,52%,100%{ transform: scaleY(1); } 49%{ transform: scaleY(.1); } }
  @keyframes flapL{ to{ transform: rotate(-30deg); } }
  @keyframes flapR{ to{ transform: rotate(30deg); } }
  .say{
    display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 18px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    color: var(--text-main); font-weight: 600; font-size: .98rem;
    transition: opacity .25s;
  }
  .say b{ color: var(--accent2); }
  .say.fade{ opacity: 0; }
  @media (prefers-reduced-motion: reduce){
    .buddy .bob, .buddy .eyes, .duo-heart{ animation: none; }
  }

  /* ---- Griglia app ---- */
  .grid{
    max-width: 1000px; margin: 0 auto; padding: 20px 24px 80px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px;
  }
  .app-card{
    position: relative; display: flex; flex-direction: column;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 22px; padding: 28px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .app-card:hover{
    transform: translateY(-8px);
    border-color: var(--card-color);
    box-shadow: 0 12px 40px -8px var(--card-color-soft);
  }
  .card-icon{ font-size: 2.6rem; margin-bottom: 12px; filter: drop-shadow(0 0 12px var(--card-color-soft)); }
  .card-title{ font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.5rem; margin-bottom: 10px; }
  .card-badge{
    display: inline-block; align-self: flex-start;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px; margin-bottom: 16px;
    color: var(--card-color); background: var(--card-color-soft); border: 1px solid var(--card-color);
  }
  .card-desc{ color: var(--text-muted); font-size: 1rem; line-height: 1.5; flex-grow: 1; margin-bottom: 22px; }
  .open-btn{
    display: inline-block; text-align: center;
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.05rem;
    text-decoration: none; color: #06090f; background: var(--card-color);
    padding: 14px 20px; border-radius: 14px;
    transition: filter 0.2s ease, transform 0.2s ease;
  }
  .open-btn:hover{ filter: brightness(1.12); transform: scale(1.02); }

  footer{ text-align: center; color: var(--text-muted); font-size: 0.85rem; padding-bottom: 30px; }

  @media (max-width: 560px){
    .app-header{ padding: 36px 16px 18px; }
    .grid{ padding: 12px 16px 60px; gap: 18px; }
    .app-card{ padding: 22px; }
  }
</style>
</head>
<body>

<div class="bg-blobs"><span></span><span></span></div>

<header class="app-header">
  <div class="duo">
    <div class="buddy petta" id="buddyPetta" title="Petta">
      <svg viewBox="0 0 120 120" role="img" aria-label="Petta, la scimmietta"><g class="bob">
        <circle cx="19" cy="62" r="15" fill="#8a5636"/><circle cx="19" cy="62" r="8.5" fill="#f6cfaa"/>
        <circle cx="101" cy="62" r="15" fill="#8a5636"/><circle cx="101" cy="62" r="8.5" fill="#f6cfaa"/>
        <circle cx="60" cy="60" r="41" fill="#9b6441"/>
        <path d="M51 23 C47 9 59 6 60 19 C63 7 75 10 68 24 Z" fill="#9b6441"/>
        <path d="M60 44 C52 33 30 34 30 54 C30 62 33 66 36 70 C34 86 46 98 60 98 C74 98 86 86 84 70 C87 66 90 62 90 54 C90 34 68 33 60 44 Z" fill="#f8d6b5"/>
        <g class="eyes"><circle cx="47" cy="56" r="5.6" fill="#2b1a12"/><circle cx="73" cy="56" r="5.6" fill="#2b1a12"/><circle cx="49" cy="53.8" r="1.9" fill="#fff"/><circle cx="75" cy="53.8" r="1.9" fill="#fff"/></g>
        <ellipse cx="38" cy="71" rx="6.5" ry="3.8" fill="#ff8d8d" opacity=".55"/><ellipse cx="82" cy="71" rx="6.5" ry="3.8" fill="#ff8d8d" opacity=".55"/>
        <ellipse cx="56.5" cy="69" rx="1.7" ry="2.1" fill="#7a4a2e"/><ellipse cx="63.5" cy="69" rx="1.7" ry="2.1" fill="#7a4a2e"/>
        <path d="M49 78 Q60 94 71 78 Z" fill="#5a2a1a"/><path d="M54 85 Q60 91 66 85 Q60 82 54 85Z" fill="#ff7c8a"/>
      </g></svg>
      <span class="buddy-name">🐒 Petta</span>
    </div>
    <div class="duo-heart">💞</div>
    <div class="buddy mari" id="buddyMari" title="Mari">
      <svg viewBox="0 0 120 120" role="img" aria-label="Mari, il pulcino"><g class="bob">
        <path d="M54 27 C46 13 57 8 60 22 C61 6 74 9 65 27 Z" fill="#ffc21f"/>
        <g class="wing-l"><ellipse cx="21" cy="76" rx="11" ry="17" transform="rotate(28 21 76)" fill="#ffc21f"/></g>
        <g class="wing-r"><ellipse cx="99" cy="76" rx="11" ry="17" transform="rotate(-28 99 76)" fill="#ffc21f"/></g>
        <ellipse cx="60" cy="66" rx="42" ry="41" fill="#ffd84a"/>
        <ellipse cx="60" cy="82" rx="27" ry="20" fill="#ffe789" opacity=".75"/>
        <g transform="translate(86 32)"><circle cx="0" cy="-6" r="5" fill="#ff8fb1"/><circle cx="5.7" cy="-1.9" r="5" fill="#ff8fb1"/><circle cx="3.5" cy="4.9" r="5" fill="#ff8fb1"/><circle cx="-3.5" cy="4.9" r="5" fill="#ff8fb1"/><circle cx="-5.7" cy="-1.9" r="5" fill="#ff8fb1"/><circle r="3.8" fill="#fff3a0"/></g>
        <g class="eyes"><circle cx="45" cy="56" r="5.6" fill="#2b1a12"/><circle cx="75" cy="56" r="5.6" fill="#2b1a12"/><circle cx="47" cy="53.8" r="1.9" fill="#fff"/><circle cx="77" cy="53.8" r="1.9" fill="#fff"/></g>
        <ellipse cx="34" cy="69" rx="6.5" ry="3.8" fill="#ff8d8d" opacity=".6"/><ellipse cx="86" cy="69" rx="6.5" ry="3.8" fill="#ff8d8d" opacity=".6"/>
        <path d="M51 67 Q60 61 69 67 Q60 73 51 67 Z" fill="#ff9a3c"/><path d="M53 69.5 Q60 78 67 69.5 Z" fill="#f2762e"/>
      </g></svg>
      <span class="buddy-name">🐥 Mari</span>
    </div>
  </div>
  <h1 class="app-title">PETTA <span>&amp; MARI</span></h1>
  <p class="app-subtitle">Le nostre app: viaggi da fare, ristoranti provati e idee per stare insieme</p>
  <p class="say" id="say"><b>Petta:</b> Dove andiamo oggi? 🗺️</p>
</header>

<main class="grid" id="appsGrid">
  <!-- Le card vengono generate da JavaScript -->
</main>

<footer>PETTA 🐒 &amp; MARI 🐥 · Aggiorna l'array <code>APPS</code> per aggiungere nuove app</footer>

<script>
  /* =========================================================
     ELENCO APP — per aggiungerne una basta inserire un nuovo
     oggetto in questo array: la pagina si aggiorna da sola.
     ========================================================= */
  const APPS = [
    {
      icon: "🗺️",
      title: "World Travel Bucket List",
      badge: "🌍 Viaggi",
      description: "Una mappa del mondo per vedere tutti gli stati e segnare dove andare. Non è un gioco, ma una fonte di ispirazione per il prossimo viaggio.",
      link: "https://petta95.github.io/WorldTravelBucketList/index.html",
      color: "#2dd4a7",
      colorSoft: "rgba(45, 212, 167, 0.18)"
    },
    {
      icon: "🍽️",
      title: "Ristoranti Visitati",
      badge: "🍷 Ristoranti",
      description: "L'elenco di tutti i ristoranti provati finora, per tenere traccia di dove siamo già stati e decidere dove tornare (o dove non tornare più).",
      link: "https://petta95.github.io/4Ristoranti/index_ristoranti.html",
      color: "#4361ee",
      colorSoft: "rgba(67, 97, 238, 0.18)"
    },
    {
      icon: "🌰",
      title: "Cosa Facciamo Oggi?",
      badge: "💛 Idee di coppia",
      description: "Più di cento attività da fare insieme, da filtrare per stagione, meteo, temperatura e cosa c'è al supermercato. Con il pulsante \"Scegli per noi\" e lo spazio per aggiungere le nostre idee.",
      link: "https://petta95.github.io/DateIdeas/index.html",
      color: "#ff9f43",
      colorSoft: "rgba(255, 159, 67, 0.18)"
    },
    {
      icon: "💡",
      title: "Impariamo Insieme",
      badge: "🧠 Curiosità",
      description: "500 schede per imparare qualcosa di nuovo ogni giorno: la curiosità di oggi, \"Accadde oggi\" da Wikipedia, 13 categorie da cultura a cucina e un mini-ripasso a domande per non dimenticare.",
      link: "https://petta95.github.io/ImpariamoInsieme/index.html",
      color: "#b388ff",
      colorSoft: "rgba(179, 136, 255, 0.18)"
    }
  ];

  const grid = document.getElementById("appsGrid");
  APPS.forEach(app => {
    const card = document.createElement("article");
    card.className = "app-card";
    card.style.setProperty("--card-color", app.color);
    card.style.setProperty("--card-color-soft", app.colorSoft);
    card.innerHTML = `
      <div class="card-icon">${app.icon}</div>
      <h2 class="card-title">${app.title}</h2>
      <span class="card-badge">${app.badge}</span>
      <p class="card-desc">${app.description}</p>
      <a class="open-btn" href="${app.link}" target="_blank" rel="noopener noreferrer">APRI ▶</a>
    `;
    grid.appendChild(card);
  });

  /* ---- Petta e Mari chiacchierano (e saltano se li tocchi) ---- */
  const LINES = [
    ["Petta", "Dove andiamo oggi? 🗺️"],
    ["Mari", "Prima si mangia, poi si decide 🍝"],
    ["Petta", "Stasera castagne e coperta? 🌰"],
    ["Mari", "Aggiungiamo un ristorante alla lista! 🍷"],
    ["Petta", "Il prossimo viaggio lo scegli tu ✈️"],
    ["Mari", "Non sappiamo cosa fare? Ci pensa \"Cosa Facciamo Oggi?\" 🎲"]
  ];
  let lineIdx = 0;
  const say = document.getElementById("say");
  function hop(id){
    const el = document.getElementById(id);
    el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
    setTimeout(() => el.classList.remove("hop"), 1200);
  }
  function nextLine(){
    const [who, text] = LINES[++lineIdx % LINES.length];
    say.classList.add("fade");
    setTimeout(() => {
      say.innerHTML = `<b>${who}:</b> ${text}`;
      say.classList.remove("fade");
      hop(who === "Petta" ? "buddyPetta" : "buddyMari");
    }, 250);
  }
  document.getElementById("buddyPetta").addEventListener("click", () => { hop("buddyPetta"); nextLine(); });
  document.getElementById("buddyMari").addEventListener("click", () => { hop("buddyMari"); nextLine(); });
  setInterval(nextLine, 6000);
</script>

</body>
</html>
