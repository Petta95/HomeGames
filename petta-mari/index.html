<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PETTA & MARI — Le Nostre App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     PETTA & MARI — raccolta delle app di coppia (viaggi,
     ristoranti, ...). Stesso stile grafico di HOME GAMES.
     ========================================================= */
  :root{
    --bg-deep: #0a0e1a;
    --text-main: #f2f4ff;
    --text-muted: #9aa3c0;
    --accent: #2dd4a7;
    --accent2: #ff6fa8;
    --glass-border: rgba(255, 255, 255, 0.10);
    --glass-bg: rgba(255, 255, 255, 0.045);
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    min-height: 100%;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* ---- Sfondo animato ---- */
  .bg-blobs{
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: radial-gradient(circle at 20% 20%, #131a33 0%, var(--bg-deep) 55%);
  }
  .bg-blobs span{
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.32;
    animation: float 22s ease-in-out infinite;
  }
  .bg-blobs span:nth-child(1){ width: 480px; height: 480px; background: var(--accent); top: -10%; left: -10%; }
  .bg-blobs span:nth-child(2){ width: 520px; height: 520px; background: var(--accent2); bottom: -15%; right: -10%; animation-delay: -6s; }
  @keyframes float{
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40px, -30px) scale(1.08); }
  }

  /* ---- Header ---- */
  .app-header{ text-align: center; padding: 56px 20px 28px; }
  .app-title{
    font-family: 'Poppins', sans-serif; font-weight: 900;
    font-size: clamp(2.4rem, 6vw, 4.4rem); letter-spacing: 2px;
    text-transform: uppercase; line-height: 1.05;
  }
  .app-title span{
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .app-subtitle{
    margin-top: 10px; font-size: clamp(1rem, 2vw, 1.25rem);
    color: var(--text-muted); font-weight: 500;
  }

  /* ---- Griglia app ---- */
  .grid{
    max-width: 1000px; margin: 0 auto; padding: 20px 24px 80px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px;
  }
  .app-card{
    position: relative; display: flex; flex-direction: column;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 22px; padding: 28px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .app-card:hover{
    transform: translateY(-8px);
    border-color: var(--card-color);
    box-shadow: 0 12px 40px -8px var(--card-color-soft);
  }
  .card-icon{ font-size: 2.6rem; margin-bottom: 12px; filter: drop-shadow(0 0 12px var(--card-color-soft)); }
  .card-title{ font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.5rem; margin-bottom: 10px; }
  .card-badge{
    display: inline-block; align-self: flex-start;
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px; margin-bottom: 16px;
    color: var(--card-color); background: var(--card-color-soft); border: 1px solid var(--card-color);
  }
  .card-desc{ color: var(--text-muted); font-size: 1rem; line-height: 1.5; flex-grow: 1; margin-bottom: 22px; }
  .open-btn{
    display: inline-block; text-align: center;
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.05rem;
    text-decoration: none; color: #06090f; background: var(--card-color);
    padding: 14px 20px; border-radius: 14px;
    transition: filter 0.2s ease, transform 0.2s ease;
  }
  .open-btn:hover{ filter: brightness(1.12); transform: scale(1.02); }

  footer{ text-align: center; color: var(--text-muted); font-size: 0.85rem; padding-bottom: 30px; }

  @media (max-width: 560px){
    .app-header{ padding: 36px 16px 18px; }
    .grid{ padding: 12px 16px 60px; gap: 18px; }
    .app-card{ padding: 22px; }
  }
</style>
</head>
<body>

<div class="bg-blobs"><span></span><span></span></div>

<header class="app-header">
  <h1 class="app-title">💞 PETTA <span>&amp; MARI</span></h1>
  <p class="app-subtitle">Le nostre app: viaggi da fare e ristoranti provati</p>
</header>

<main class="grid" id="appsGrid">
  <!-- Le card vengono generate da JavaScript -->
</main>

<footer>PETTA &amp; MARI · Aggiorna l'array <code>APPS</code> per aggiungere nuove app</footer>

<script>
  /* =========================================================
     ELENCO APP — per aggiungerne una basta inserire un nuovo
     oggetto in questo array: la pagina si aggiorna da sola.
     ========================================================= */
  const APPS = [
    {
      icon: "🗺️",
      title: "World Travel Bucket List",
      badge: "🌍 Viaggi",
      description: "Una mappa del mondo per vedere tutti gli stati e segnare dove andare. Non è un gioco, ma una fonte di ispirazione per il prossimo viaggio.",
      link: "https://petta95.github.io/WorldTravelBucketList/index.html",
      color: "#2dd4a7",
      colorSoft: "rgba(45, 212, 167, 0.18)"
    },
    {
      icon: "🍽️",
      title: "Ristoranti Visitati",
      badge: "🍷 Ristoranti",
      description: "L'elenco di tutti i ristoranti provati finora, per tenere traccia di dove siamo già stati e decidere dove tornare (o dove non tornare più).",
      link: "https://petta95.github.io/4Ristoranti/index_ristoranti.html",
      color: "#4361ee",
      colorSoft: "rgba(67, 97, 238, 0.18)"
    }
  ];

  const grid = document.getElementById("appsGrid");
  APPS.forEach(app => {
    const card = document.createElement("article");
    card.className = "app-card";
    card.style.setProperty("--card-color", app.color);
    card.style.setProperty("--card-color-soft", app.colorSoft);
    card.innerHTML = `
      <div class="card-icon">${app.icon}</div>
      <h2 class="card-title">${app.title}</h2>
      <span class="card-badge">${app.badge}</span>
      <p class="card-desc">${app.description}</p>
      <a class="open-btn" href="${app.link}" target="_blank" rel="noopener noreferrer">APRI ▶</a>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
